<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">load_tiles</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">data_t</span> *B, BChannel&amp; out, <span class="hljs-type">int</span> NT)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t=<span class="hljs-number">0</span>; t&lt;NT; ++t) {
    <span class="hljs-function">hls::write_lock&lt;BBlock&gt; <span class="hljs-title">b</span><span class="hljs-params">(out)</span></span>; <span class="hljs-comment">// waits for an empty B slot</span>
    <span class="hljs-built_in">load_one</span>(B, b, t);              <span class="hljs-comment">// scope exit marks it full</span>
  }
}
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">compute_tiles</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">data_t</span> *A, BChannel&amp; in,
                   CChannel&amp; out, <span class="hljs-type">int</span> NT)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t=<span class="hljs-number">0</span>; t&lt;NT; ++t) {
    <span class="hljs-function">hls::read_lock&lt;BBlock&gt;  <span class="hljs-title">b</span><span class="hljs-params">(in)</span></span>;  <span class="hljs-comment">// waits for a full B tile</span>
    <span class="hljs-function">hls::write_lock&lt;CBlock&gt; <span class="hljs-title">c</span><span class="hljs-params">(out)</span></span>; <span class="hljs-comment">// waits for an empty C slot</span>
    <span class="hljs-built_in">compute_one</span>(A, b, c, t);
  }                                 <span class="hljs-comment">// release B; publish C</span>
}
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">store_tiles</span><span class="hljs-params">(<span class="hljs-type">data_t</span> *C, CChannel&amp; in, <span class="hljs-type">int</span> NT)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t=<span class="hljs-number">0</span>; t&lt;NT; ++t) {
    <span class="hljs-function">hls::read_lock&lt;CBlock&gt; <span class="hljs-title">c</span><span class="hljs-params">(in)</span></span>;   <span class="hljs-comment">// waits for a full C tile</span>
    <span class="hljs-built_in">store_one</span>(C, c, t);
  }
}
</code></pre>
<blockquote>
<p>A lock acquisition is the availability test: it blocks until the required<br />
empty/full slot exists. We develop the lock API later.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="similar-source-but-cross-tile-overlap-is-not-explicit">Similar source, but cross-tile overlap is not explicit</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t=<span class="hljs-number">0</span>; t&lt;NT; ++t) {
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-built_in">load_one</span>(t); <span class="hljs-built_in">compute_one</span>(t); <span class="hljs-built_in">store_one</span>(t);
}
</code></pre>
<p>Here each stage call describes only <strong>one tile</strong>. Cross-tile overlap relies on<br />
Vitis recognizing a supported <strong>dataflow-in-a-loop</strong> form and providing separate<br />
channel slots for adjacent iterations.</p>
<blockquote>
<p>No second <code>PIPELINE</code> pragma is implied. The <code>DATAFLOW</code> transformation itself<br />
overlaps supported loop iterations—and the result must be verified.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="dense" data-theme="fpga" lang="C" class="dense" data-marpit-pagination="13" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:dense;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="how-the-dataflow-loop-can-overlap-iterations">How the dataflow loop can overlap iterations</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-comment">// B is K×N. Tile t selects T adjacent columns: B[:, tT : (t+1)T]</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t=<span class="hljs-number">0</span>; t&lt;NT; ++t) {       <span class="hljs-comment">// NT = ceil(N/T)</span>
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-type">data_t</span> Btile[K][T];            <span class="hljs-comment">// K reduction rows × T columns</span>
  <span class="hljs-built_in">load_B_tile</span>(B, Btile, t);      <span class="hljs-comment">// produces B[:, tT : (t+1)T]</span>
  <span class="hljs-built_in">compute_C_strip</span>(A, Btile, C,t);<span class="hljs-comment">// produces T columns of C</span>
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">iteration t:       load(t) ───────▶ compute(t)
iteration t+1:           load(t+1) ───────▶ compute(t+1)
buffer slot:          A       B       A       B
</code></pre>
<p>The two-slot PIPO lets <code>load(t+1)</code> fill one <code>K×T</code> B tile while<br />
<code>compute(t)</code> reads the other.</p>
<blockquote>
<p>Supported, but more constrained and less explicit than persistent stages.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="canonical-dataflow-make-the-graph-visible">Canonical <code>DATAFLOW</code>: make the graph visible</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">top</span><span class="hljs-params">(<span class="hljs-type">const</span> T *in, T *out, <span class="hljs-type">int</span> num_items)</span> </span>{
  hls::stream&lt;T&gt; q;              <span class="hljs-comment">// internal FIFO; default depth = 2</span>

  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-built_in">produce</span>(in, q, num_items);   <span class="hljs-comment">// writes num_items tokens</span>
  <span class="hljs-built_in">consume</span>(q, out, num_items);  <span class="hljs-comment">// reads  num_items tokens</span>
}
</code></pre>
<ul>
<li>Clear stage calls</li>
<li>Explicit channel edges</li>
<li>One producer and one consumer per channel</li>
<li>Matching transfer count: <strong><code>num_items</code> writes = <code>num_items</code> reads</strong></li>
</ul>
<blockquote>
<p><code>num_items</code> = total tokens transferred; <strong>depth = tokens stored at once</strong>.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="blocking-is-coordination">Blocking is coordination</h2>
<ul>
<li><code>read()</code> on empty → reader waits.</li>
<li><code>write()</code> on full → writer waits.</li>
<li>A later neighboring action releases the wait.</li>
</ul>
<blockquote>
<p><strong>Backpressure:</strong> a downstream pause propagates upstream through full channels.</p>
</blockquote>
<p>Waiting is normal. A graph is deadlocked only when <strong>no future action can progress</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-slowest-sustainable-rate-wins">The slowest sustainable rate wins</h2>
<table>
<thead>
<tr>
<th>stage</th>
<th style="text-align:right">transaction interval</th>
</tr>
</thead>
<tbody>
<tr>
<td>load</td>
<td style="text-align:right">2,000 cycles/tile</td>
</tr>
<tr>
<td>compute</td>
<td style="text-align:right"><strong>7,500 cycles/tile</strong></td>
</tr>
<tr>
<td>store</td>
<td style="text-align:right">1,000 cycles/tile</td>
</tr>
</tbody>
</table>
<p>Steady state ≈ <strong>7,500 cycles/tile</strong>.</p>
<blockquote>
<p>A deeper channel cannot make the compute stage accept tiles faster.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="two-levels-of-pipelining">Two levels of pipelining</h2>
<table>
<thead>
<tr>
<th>Directive</th>
<th>Overlaps</th>
<th>Main rate knob</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>PIPELINE</code></td>
<td>iterations <strong>inside one task</strong></td>
<td>loop II</td>
</tr>
<tr>
<td><code>DATAFLOW</code></td>
<td><strong>different tasks</strong></td>
<td>stage transaction interval</td>
</tr>
</tbody>
</table>
<blockquote>
<p>High-throughput designs pipeline the loops <strong>inside</strong> concurrent dataflow tasks.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="fifo-releases-one-element-immediately">FIFO releases one element immediately</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">producer: write x0 · write x1 · write x2 · …
                    │
consumer:       read x0 · read x1 · read x2 · …
</code></pre>
<ul>
<li>first-in, first-out;</li>
<li>each item read <strong>once</strong>;</li>
<li>producer and consumer agree on <strong>order</strong>.</li>
</ul>
<blockquote>
<p>Consumer may start before the complete array exists.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="fifo-in-hls-hlsstreamt">FIFO in HLS: <code>hls::stream&lt;T&gt;</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">produce</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">int</span> *in, hls::stream&lt;<span class="hljs-type">int</span>&gt;&amp; q, <span class="hljs-type">int</span> n)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i=<span class="hljs-number">0</span>; i&lt;n; ++i) {
    <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
    q.<span class="hljs-built_in">write</span>(<span class="hljs-number">3</span> * in[i]);
  }
}
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">consume</span><span class="hljs-params">(hls::stream&lt;<span class="hljs-type">int</span>&gt;&amp; q, <span class="hljs-type">int</span> *out, <span class="hljs-type">int</span> n)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i=<span class="hljs-number">0</span>; i&lt;n; ++i) {
    <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
    out[i] = q.<span class="hljs-built_in">read</span>() + <span class="hljs-number">1</span>;
  }
}
</code></pre>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="pipo-releases-the-complete-array">PIPO releases the complete array</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">producer invocation:  write indices in any order ── return
                                                      │ swap
consumer invocation:                                  read stable array
</code></pre>
<ul>
<li>arbitrary indexed access;</li>
<li>complete version seen by consumer;</li>
<li>normally two full banks for overlap.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="type-selects-policyaccess-decides-legality">Type selects policy—access decides legality</h2>
<div class="columns">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">data_t</span> q[N];
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
<span class="hljs-built_in">produce_array</span>(q);
<span class="hljs-built_in">consume_array</span>(q);
</code></pre>
<p>Array edge → <strong>PIPO</strong> by default</p>
</div><div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">hls::stream&lt;<span class="hljs-type">data_t</span>&gt; q;
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
<span class="hljs-built_in">produce_stream</span>(q);
<span class="hljs-built_in">consume_stream</span>(q);
</code></pre>
<p>Stream edge → <strong>FIFO</strong></p>
</div></div>
<blockquote>
<p>The replacement is valid only if both access sequences match.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-decision-is-about-accessnot-datatype">The decision is about access—not datatype</h2>
<table>
<thead>
<tr>
<th>Question</th>
<th>Yes</th>
<th>No</th>
</tr>
</thead>
<tbody>
<tr>
<td>Read once, same order as writes?</td>
<td>FIFO is possible</td>
<td>keep block/array storage</td>
</tr>
<tr>
<td>Need indexed reuse inside a unit?</td>
<td>block or PIPO</td>
<td>FIFO fits</td>
</tr>
<tr>
<td>Need the complete array first?</td>
<td>PIPO</td>
<td>release earlier</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Choose the <strong>smallest safe release unit</strong>.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-we-need-a-middle-option">Why we need a middle option</h2>
<p>Producer creates an <code>M×N</code> result <strong>one row at a time</strong>.<br />
Consumer needs <code>row[N−1]</code>, then <code>row[0]</code>, then other columns.</p>
<ul>
<li>Full-matrix PIPO: waits for all <code>M</code> rows; stores two matrices.</li>
<li>Element FIFO: releases early, but loses row indexing.</li>
</ul>
<blockquote>
<p>Release <strong>one complete row</strong> at a time.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="29" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="stream-of-blocks-fifo-outside-array-inside">Stream-of-blocks: FIFO outside, array inside</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">[ row 0 ]  →  [ row 1 ]  →  [ row 2 ]  → …
    │
    └── current owner may access [7], [0], [3], …
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">using</span> Row = <span class="hljs-type">float</span>[N];
hls::stream_of_blocks&lt;Row, <span class="hljs-number">2</span>&gt; rows;
</code></pre>
<p>Depth 2 = <strong>two total row slots</strong>, including acquired slots.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="30" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="construction-acquires-the-brace-releases">Construction acquires; the brace releases</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> r=<span class="hljs-number">0</span>; r&lt;M; ++r) {
  <span class="hljs-function">hls::write_lock&lt;Row&gt; <span class="hljs-title">row</span><span class="hljs-params">(out)</span></span>; <span class="hljs-comment">// claim empty row</span>
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> c=<span class="hljs-number">0</span>; c&lt;N; ++c)
    row[c] = <span class="hljs-built_in">make_value</span>(r,c);
}                               <span class="hljs-comment">// publish completed row</span>

<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> r=<span class="hljs-number">0</span>; r&lt;M; ++r) {
  <span class="hljs-function">hls::read_lock&lt;Row&gt; <span class="hljs-title">row</span><span class="hljs-params">(in)</span></span>;   <span class="hljs-comment">// claim next full row</span>
  <span class="hljs-built_in">use</span>(row[N<span class="hljs-number">-1</span>], row[<span class="hljs-number">0</span>]);
}                               <span class="hljs-comment">// recycle row slot</span>
</code></pre>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="tiled-gemm-now-reads-naturally">Tiled GEMM now reads naturally</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">using</span> BBlock = <span class="hljs-type">data_t</span>[K][T];
<span class="hljs-keyword">using</span> CBlock = <span class="hljs-type">data_t</span>[M][T];

hls::stream_of_blocks&lt;BBlock,<span class="hljs-number">2</span>&gt; b_tiles;
hls::stream_of_blocks&lt;CBlock,<span class="hljs-number">2</span>&gt; c_tiles;

<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
<span class="hljs-built_in">load_tiles</span>(B, b_tiles);                 <span class="hljs-comment">// write_lock</span>
<span class="hljs-built_in">compute_tiles</span>(A, b_tiles, c_tiles);    <span class="hljs-comment">// read_lock + write_lock</span>
<span class="hljs-built_in">store_tiles</span>(C, c_tiles);               <span class="hljs-comment">// read_lock</span>
</code></pre>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="write-a-contract-for-every-edge">Write a contract for every edge</h2>
<table>
<thead>
<tr>
<th>Property</th>
<th>Question</th>
</tr>
</thead>
<tbody>
<tr>
<td>type + shape</td>
<td>what is transferred?</td>
</tr>
<tr>
<td>count + order</td>
<td>how many, in what sequence?</td>
</tr>
<tr>
<td>granularity</td>
<td>element, row/tile, or array?</td>
</tr>
<tr>
<td>rates</td>
<td>how often can each side transact?</td>
</tr>
<tr>
<td>depth</td>
<td>what bounded burst/skew must fit?</td>
</tr>
</tbody>
</table>
<blockquote>
<p>If the contract is vague, the hardware schedule is guesswork.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="missing-data-is-not-a-depth-problem">Missing data is not a depth problem</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">producer writes: x0 x1 … x(N−1)             N items
consumer reads:  x0 x1 … x(N−1) [ waits ]   N+1 reads
</code></pre>
<p>The final read blocks forever.</p>
<blockquote>
<p>No FIFO depth can manufacture the missing token.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="fix-protocol-before-buying-memory">Fix protocol before buying memory</h2>
<p>Preferred:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i=<span class="hljs-number">0</span>; i&lt;N; ++i) {
  A.<span class="hljs-built_in">write</span>(<span class="hljs-built_in">make_a</span>(i));
  B.<span class="hljs-built_in">write</span>(<span class="hljs-built_in">make_b</span>(i));
}
</code></pre>
<p>If “all A before any B” is truly required, A must hold that bounded burst.</p>
<blockquote>
<p>Depth is a schedule-derived capacity—not a superstition.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="size-fifos-with-evidence">Size FIFOs with evidence</h2>
<ol>
<li>Start large enough for the maximum burst/transaction.</li>
<li>Run <strong>C/RTL co-simulation</strong>.</li>
<li>Enable <strong>dataflow channel profiling</strong>.</li>
<li>Inspect occupancy and blocked readers/writers.</li>
<li>Reduce depth; re-run; record the tradeoff.</li>
</ol>
<blockquote>
<p>Default depth 2 is a starting point, not a proof.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="implicit-channels-arrays-%E2%86%92-pipos">Implicit channels: arrays → PIPOs</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">diamond</span><span class="hljs-params">(<span class="hljs-type">data_t</span> in[N], <span class="hljs-type">data_t</span> out[N])</span> </span>{
  <span class="hljs-type">data_t</span> c1[N], c2[N], c3[N], c4[N];
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-built_in">funcA</span>(in, c1, c2);   <span class="hljs-comment">// t=3x; fork</span>
  <span class="hljs-built_in">funcB</span>(c1, c3);       <span class="hljs-comment">// b=t+25</span>
  <span class="hljs-built_in">funcC</span>(c2, c4);       <span class="hljs-comment">// c=2t</span>
  <span class="hljs-built_in">funcD</span>(c3, c4, out);  <span class="hljs-comment">// out=b+2c</span>
}
</code></pre>
<p>Four local arrays become four complete-array handoffs.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="dense" data-theme="fpga" lang="C" class="dense" data-marpit-pagination="44" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:dense;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="explicit-channels-streams-%E2%86%92-fifos">Explicit channels: streams → FIFOs</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">diamond</span><span class="hljs-params">(...)</span> </span>{
  hls::stream&lt;<span class="hljs-type">data_t</span>&gt; c1, c2, c3, c4;
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-built_in">funcA</span>(in, c1, c2); <span class="hljs-built_in">funcB</span>(c1, c3);
  <span class="hljs-built_in">funcC</span>(c2, c4);     <span class="hljs-built_in">funcD</span>(c3, c4, out);
}
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">funcB</span><span class="hljs-params">(hls::stream&lt;<span class="hljs-type">data_t</span>&gt;&amp; in,
           hls::stream&lt;<span class="hljs-type">data_t</span>&gt;&amp; out)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i=<span class="hljs-number">0</span>;i&lt;N;i++) {
    <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
    out.<span class="hljs-built_in">write</span>(in.<span class="hljs-built_in">read</span>()<span class="hljs-number">+25</span>);
  }
}
</code></pre>

<h2 id="two-source-calls-do-not-promise-one-engine">Two source calls do not promise one engine</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">float</span> Z[M][N];
<span class="hljs-built_in">rp_gemm</span>(X,   W_A, Z);
<span class="hljs-built_in">rp_gemm</span>(Z,   W_B, Y);
</code></pre>
<p>There are <strong>two call sites</strong>. HLS may build one hardware block for each site.</p>
<blockquote>
<p>Reusing a C++ function body does not request shared hardware.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="50" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-hls-must-decide-for-each-call">What HLS must decide for each call</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">call site 1 ──▶ use an existing GEMM instance?
             └▶ or specialize a new instance?

call site 2 ──▶ use an existing GEMM instance?
             └▶ or specialize a new instance?
</code></pre>
<p>Sharing is possible only if both calls need a compatible physical interface.</p>
<blockquote>
<p>Same function name is not enough information.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="51" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="allo-pitfall-ii-expected-versus-obtained">Allo Pitfall II: expected versus obtained</h2>
<table>
<thead>
<tr>
<th>U280 paper case</th>
<th style="text-align:right">latency</th>
<th style="text-align:right">DSP</th>
</tr>
</thead>
<tbody>
<tr>
<td>one optimized GEMM</td>
<td style="text-align:right">112 ms</td>
<td style="text-align:right">160</td>
</tr>
<tr>
<td>naïve two-call cascade</td>
<td style="text-align:right"><strong>280 ms</strong></td>
<td style="text-align:right"><strong>320</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>Expected sharing: about <code>2×112 = 224 ms</code>, 160 DSP.</li>
<li>Obtained: two different engines, 320 DSP—and one was slower.</li>
</ul>
<p><span class="caption">Allo, PLDI 2024, §3.2 and Fig. 3 — not a local U50 measurement.</span></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="52" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-function-interface-is-physical">A function interface is physical</h2>
<p>For software, this looks like the interface:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">rp_gemm</span><span class="hljs-params">(<span class="hljs-type">float</span> A[N][N],
             <span class="hljs-type">float</span> B[N][N],
             <span class="hljs-type">float</span> C[N][N])</span></span>;
</code></pre>
<p>For HLS, the interface also includes:</p>
<blockquote>
<p>number of banks · partition mode · partition dimension · ports per bank</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-z-changes-the-second-call">Why <code>Z</code> changes the second call</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">call 1 output: C = Z  ── partitioned into 32 banks
                              │
                              ▼
call 2 input:  A = Z  ── therefore arrives as 32 banks
</code></pre>
<p>But call 1’s A input (<code>X</code>) had one bank.</p>
<blockquote>
<p>Formal argument A means two different physical things at the two call sites.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="55" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="different-interface-%E2%86%92-different-hardware-instance">Different interface → different hardware instance</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">call 1 needs: A₁bank  · B₃₂banks · C₃₂banks
call 2 needs: A₃₂banks · B₃₂banks · C₃₂banks
</code></pre>
<p>One fixed port list cannot be both shapes.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">rp_gemm    ← specialized for call 1
rp_gemm_1  ← specialized for call 2
</code></pre>
<footer>IIIT · Suresh Purini</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="57" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="example-make-a-b-and-c-agree">Example: make A, B, and C agree</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">rp_gemm</span><span class="hljs-params">(<span class="hljs-type">float</span> A[N][N], <span class="hljs-type">float</span> B[N][N], <span class="hljs-type">float</span> C[N][N])</span> </span>{
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=A cyclic factor=32 dim=2</span>
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=B cyclic factor=32 dim=2</span>
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=C cyclic factor=32 dim=2</span>
  <span class="hljs-comment">// optimized GEMM body</span>
}
</code></pre>
<p>Now both calls see the same interface: <strong>A×32, B×32, C×32 banks</strong>.</p>
<blockquote>
<p>The exact dimension follows the kernel’s parallel access pattern.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="58" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-if-an-argument-does-not-match">What if an argument does not match?</h2>
<p>The unified interface is a <strong>contract for every call</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">actual argument matches      → connect to the shared engine
actual argument differs      → copy/repartition, or build another engine
connection is impossible     → compilation fails
</code></pre>
<p>Different matrix <strong>values</strong> are fine. Its physical organization must agree:</p>
<blockquote>
<p>dimensions · partition dimension · factor · mode · ports</p>
</blockquote>
<p>Declaring a unified interface does not reshape every caller for free.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="59" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="then-request-one-instance-explicitly">Then request one instance explicitly</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">top</span><span class="hljs-params">(...)</span> </span>{
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ALLOCATION instances=rp_gemm limit=1 function</span>
  <span class="hljs-type">float</span> Z[N][N];

  <span class="hljs-built_in">rp_gemm</span>(X, W_A, Z);
  <span class="hljs-built_in">rp_gemm</span>(Z, W_B, Y);
}
</code></pre>
<ul>
<li>Unified ports make sharing possible.</li>
<li><code>ALLOCATION limit=1</code> makes sharing intentional.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="60" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="sharing-produces-a-serial-schedule">Sharing produces a serial schedule</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">one GEMM engine:  [ compute all Z ][ compute all Y ]
intermediate:     [------ full Z memory ------]
</code></pre>
<ul>
<li>approximately one engine’s DSPs;</li>
<li>approximately the sum of both GEMM latencies;</li>
<li>complete <code>Z</code> survives between uses.</li>
</ul>
<blockquote>
<p>Hardware sharing saves area; it does not overlap the two GEMMs.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="61" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="streaming-asks-for-a-different-architecture">Streaming asks for a different architecture</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">GEMM 1 ── Z rows/tiles ──▶ GEMM 2
</code></pre>
<ul>
<li>Both engines must exist at the same time.</li>
<li>Therefore this design intentionally uses two instances.</li>
<li>The intermediate becomes a channel, not a full-matrix rendezvous.</li>
</ul>
<blockquote>
<p>Do not combine <code>limit=1</code> with a design that requires concurrent engines.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="62" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="can-gemm-2-start-after-one-row">Can GEMM 2 start after one row?</h2>
<p>For <code>Z=XW_A</code> and <code>Y=ZW_B</code>:</p>
<ul>
<li>each row <code>Z[r,:]</code> depends only on <code>X[r,:]</code> and <code>W_A</code>;</li>
<li>row <code>Y[r,:]</code> depends only on <code>Z[r,:]</code> and <code>W_B</code>;</li>
<li>different rows are independent.</li>
</ul>
<blockquote>
<p>GEMM 2 may consume row <code>r</code> before GEMM 1 finishes row <code>r+1</code>.</p>
</blockquote>
<p>The schedules must agree on row order.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="63" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-an-element-fifo-may-be-too-small-a-unit">Why an element FIFO may be too small a unit</h2>
<p>To compute one row of <code>Y</code>, GEMM 2 reuses values from <code>Z[r,:]</code> across many output<br />
columns.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Z row:  z₀  z₁  z₂  … zₕ₋₁
         ↘   ↓   ↓       ↙    reused for Y[r,0], Y[r,1], …
</code></pre>
<blockquote>
<p>The row should stream between engines—but remain an indexable local block.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="64" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="carry-one-z-row-per-channel-transaction">Carry one <code>Z</code> row per channel transaction</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">using</span> ZRow = <span class="hljs-type">data_t</span>[H];
hls::stream_of_blocks&lt;ZRow,<span class="hljs-number">2</span>&gt; z_rows;
</code></pre>
<ul>
<li><code>write_lock</code>: GEMM 1 fills one row.</li>
<li>Scope exit publishes that row.</li>
<li><code>read_lock</code>: GEMM 2 owns and reuses it.</li>
</ul>
<p>Depth 2 permits producer row <code>r+1</code> and consumer row <code>r</code> simultaneously.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="65" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="sharing-and-streaming-optimize-different-goals">Sharing and streaming optimize different goals</h2>
<table>
<thead>
<tr>
<th>Architecture</th>
<th style="text-align:right">GEMM engines</th>
<th>Intermediate</th>
<th>Main benefit</th>
</tr>
</thead>
<tbody>
<tr>
<td>shared</td>
<td style="text-align:right">1</td>
<td>complete <code>Z</code></td>
<td>lower compute area</td>
</tr>
<tr>
<td>spatial cascade</td>
<td style="text-align:right">2</td>
<td>row/tile channel</td>
<td>overlapped throughput</td>
</tr>
</tbody>
</table>
<blockquote>
<p>“One instance or two?” is an architecture decision—not an HLS accident.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="67" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="first-contract-does-the-data-mean-the-same-thing">First contract: does the data mean the same thing?</h2>
<table>
<thead>
<tr>
<th>Must agree</th>
<th>Example question</th>
</tr>
</thead>
<tbody>
<tr>
<td>type + shape</td>
<td>is this exactly one <code>Z</code> row?</td>
</tr>
<tr>
<td>layout</td>
<td>which dimension is partitioned?</td>
</tr>
<tr>
<td>order + count</td>
<td>which row arrives next, how many?</td>
</tr>
</tbody>
</table>
<p>If these disagree, the consumer interprets the producer’s data incorrectly—or<br />
HLS must insert/rebuild storage.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="68" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="second-contract-can-the-channel-sustain-the-schedule">Second contract: can the channel sustain the schedule?</h2>
<table>
<thead>
<tr>
<th>Must agree</th>
<th>Example question</th>
</tr>
</thead>
<tbody>
<tr>
<td>granularity</td>
<td>scalar, row/tile, or full tensor?</td>
</tr>
<tr>
<td>production/consumption</td>
<td>how often is one unit transferred?</td>
</tr>
<tr>
<td>capacity</td>
<td>how much bounded skew must fit?</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Correct meaning first; adequate rate and depth second.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="69" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="inside-the-hls-top-vs-outside-it">Inside the HLS top vs outside it</h2>
<table>
<thead>
<tr>
<th>Construct</th>
<th>Boundary</th>
</tr>
</thead>
<tbody>
<tr>
<td>local <code>hls::stream</code> / block stream</td>
<td>between internal tasks</td>
</tr>
<tr>
<td>top-level <code>axis</code></td>
<td>streaming component port</td>
</tr>
<tr>
<td><code>m_axi</code></td>
<td>bulk external-memory traffic</td>
</tr>
<tr>
<td><code>s_axilite</code></td>
<td>configuration + launch control</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Two functions touching the same <code>m_axi</code> memory do not automatically form a stream.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="70" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="part-6-in-one-decision-tree">Part 6 in one decision tree</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Should the two GEMMs run at the same time?
├── no  → unify physical interfaces + ALLOCATION limit=1
│         keep complete Z; execute serially
└── yes → instantiate two engines intentionally
          align row/tile schedules; choose a channel for Z
</code></pre>
<blockquote>
<p>Choose the architecture first. Pragmas and channel types express that choice.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="71" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="exit-ticket">Exit ticket</h2>
<p>Choose and justify:</p>
<ol>
<li>grayscale pixel → negative pixel;</li>
<li>random-access B tile reused throughout GEMM;</li>
<li>GEMM 1 produces rows; GEMM 2 reuses each row.</li>
</ol>
<p class="question"><strong>Use only:</strong> access order + earliest safe release.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="72" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="73">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-through-line">The through-line</h2>
<ul>
<li><strong>Tasks</strong> define computation.</li>
<li><strong>Channels</strong> define communication and synchronization.</li>
<li><strong>Rates + capacity</strong> determine throughput and liveness.</li>
<li>The complete <strong>graph</strong> is the hardware architecture.</li>
</ul>
<blockquote>
<p>Next: a systolic array is this model repeated—a grid of tiny tasks streaming to neighbors.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-class="title" data-theme="fpga" lang="C" class="title" style="--class:title;--theme:fpga;">

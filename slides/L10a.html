<h2 id="needleman%E2%80%93wunsch--linear-gaps--score-only">Needleman–Wunsch · linear gaps · score only</h2>

<h2 id="one-question-for-this-lecture">One question for this lecture</h2>
<p>We know how to fill an alignment matrix in software.</p>
<p>How can a <strong>one-dimensional chain of processing elements</strong> fill it much faster?</p>
<p class="question"><strong>One PE owns one matrix column and is reused for every row.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="we-deliberately-begin-with-the-simplest-version">We deliberately begin with the simplest version</h2>
<p>Today:</p>
<ul>
<li>Needleman–Wunsch global alignment</li>
<li>match <code>+2</code>, mismatch <code>−1</code></li>
<li>one fixed gap penalty <code>−2</code></li>
<li>score only</li>
<li>sequence <code>B</code> fits in the PE chain</li>
</ul>
<p>Later: affine gaps, longer sequences, and traceback.</p>

<h2 id="why-those-three-neighbours">Why those three neighbours?</h2>
<table>
<thead>
<tr>
<th>predecessor</th>
<th>what is newly consumed?</th>
<th>new alignment column</th>
</tr>
</thead>
<tbody>
<tr>
<td>diagonal <code>(i−1,j−1)</code></td>
<td><code>aᵢ</code> and <code>bⱼ</code></td>
<td><code>aᵢ / bⱼ</code></td>
</tr>
<tr>
<td>above <code>(i−1,j)</code></td>
<td>only <code>aᵢ</code></td>
<td><code>aᵢ / −</code></td>
</tr>
<tr>
<td>left <code>(i,j−1)</code></td>
<td>only <code>bⱼ</code></td>
<td><code>− / bⱼ</code></td>
</tr>
</tbody>
</table>
<p>Moving through the matrix constructs the alignment one column at a time.</p>
<p>Repeated horizontal moves extend a gap in <code>A</code>; repeated vertical moves extend a gap in <code>B</code>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="boundaries-mean-alignment-with-an-empty-string">Boundaries mean alignment with an empty string</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">H(0,0) = 0
H(i,0) = −2i
H(0,j) = −2j
</code></pre>
<p>Why?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">ACG       costs three gaps = −6
---
</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="work-the-highlighted-cell">Work the highlighted cell</h2>
<p>For <code>H(2,2)</code>, compare <code>C</code> with <code>G</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">diagonal: H(1,1) − 1 =  2 − 1 =  1
above:    H(1,2) − 2 =  0 − 2 = −2
left:     H(2,1) − 2 =  0 − 2 = −2
</code></pre>
<p>Therefore <code>H(2,2) = 1</code>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="every-cell-needs-only-three-scores">Every cell needs only three scores</h2>
<p>To compute the orange cell:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">diagonal     above
       ↘     ↓
         current
       →
      left
</code></pre>
<p>We do not need the entire matrix at that instant—only these dependencies.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="16" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="2--find-the-parallel-work">2 · Find the parallel work</h1>
<h2 id="independent-cells-lie-on-one-anti-diagonal">Independent cells lie on one anti-diagonal</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="row-order-hides-the-parallelism">Row order hides the parallelism</h2>
<p>Software usually computes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">row 1: H(1,1), H(1,2), H(1,3)
row 2: H(2,1), H(2,2), H(2,3)
row 3: H(3,1), H(3,2), H(3,3)
</code></pre>
<p>Within a row, each cell waits for the cell on its left.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="compute-diagonal-wavefronts-instead">Compute diagonal wavefronts instead</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">wave 1: H(1,1)
wave 2: H(2,1)  H(1,2)
wave 3: H(3,1)  H(2,2)  H(1,3)
wave 4:         H(3,2)  H(2,3)
wave 5:                 H(3,3)
</code></pre>
<p>Every dependency comes from an earlier wave.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-crucial-observation">The crucial observation</h2>
<p>Cells on the same anti-diagonal do not depend on one another.</p>
<p>Therefore they may execute simultaneously.</p>
<p class="question"><strong>The FPGA will turn space in the matrix into space in hardware.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="but-we-do-not-build-nine-cell-units">But we do not build nine cell units</h2>
<p>Our <code>3 × 3</code> matrix contains nine cells.</p>
<p>We build only three PEs:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1 owns column 1
PE2 owns column 2
PE3 owns column 3
</code></pre>
<p>Each PE is reused for every row in its column.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="21" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="3--assign-one-column-to-each-pe">3 · Assign one column to each PE</h1>
<h2 id="keep-b-fixed-stream-a-through-the-chain">Keep B fixed; stream A through the chain</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="load-b-into-the-hardware">Load B into the hardware</h2>
<p>For <code>B = AGT</code>:</p>
<table>
<thead>
<tr>
<th>PE</th>
<th>fixed character</th>
<th>cells computed over time</th>
</tr>
</thead>
<tbody>
<tr>
<td>PE1</td>
<td><code>A</code></td>
<td><code>H(1,1), H(2,1), H(3,1)</code></td>
</tr>
<tr>
<td>PE2</td>
<td><code>G</code></td>
<td><code>H(1,2), H(2,2), H(3,2)</code></td>
</tr>
<tr>
<td>PE3</td>
<td><code>T</code></td>
<td><code>H(1,3), H(2,3), H(3,3)</code></td>
</tr>
</tbody>
</table>
<p>The fixed character identifies the PE’s column.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="23" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="now-stream-a-one-character-per-cycle">Now stream A, one character per cycle</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">cycle 1: inject A[1] = A
cycle 2: inject A[2] = C
cycle 3: inject A[3] = G
</code></pre>
<p>Each PE registers and forwards the character to its right.</p>
<p>Thus <code>A[1]</code> reaches PE2 one cycle after it reaches PE1.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="cycle-1">Cycle 1</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1                    PE2        PE3
H(1,1): A versus A      —          —
</code></pre>
<p>Only PE1 has valid work.</p>
<p>It computes the first matrix cell and registers its result.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="cycle-2">Cycle 2</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1                    PE2                    PE3
H(2,1): C versus A     H(1,2): A versus G      —
</code></pre>
<p>PE1 works on the next row.</p>
<p>PE2 receives the delayed <code>A</code> character and PE1’s registered score.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="cycle-3the-array-is-full">Cycle 3—the array is full</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1                    PE2                    PE3
H(3,1): G versus A     H(2,2): C versus G     H(1,3): A versus T
</code></pre>
<p>Three cells on one anti-diagonal are computed in parallel.</p>
<p>Each physical PE is working on a different matrix row.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="cycle-4the-pipeline-drains">Cycle 4—the pipeline drains</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1       PE2                    PE3
 —        H(3,2): G versus G     H(2,3): C versus T
</code></pre>
<p>There is no new input for PE1.</p>
<p>Previously injected characters are still moving right.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="29" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="cycle-5">Cycle 5</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1       PE2       PE3
 —         —        H(3,3): G versus T
</code></pre>
<p>PE3 produces the final score <code>H(3,3) = 0</code>.</p>
<p>The entire <code>3 × 3</code> matrix took five compute cycles.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="30" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-whole-schedule">The whole schedule</h2>
<table>
<thead>
<tr>
<th style="text-align:right">cycle</th>
<th>PE1: fixed <code>A</code></th>
<th>PE2: fixed <code>G</code></th>
<th>PE3: fixed <code>T</code></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:right">1</td>
<td><code>H(1,1)</code> A/A</td>
<td>—</td>
<td>—</td>
</tr>
<tr>
<td style="text-align:right">2</td>
<td><code>H(2,1)</code> C/A</td>
<td><code>H(1,2)</code> A/G</td>
<td>—</td>
</tr>
<tr>
<td style="text-align:right">3</td>
<td><code>H(3,1)</code> G/A</td>
<td><code>H(2,2)</code> C/G</td>
<td><code>H(1,3)</code> A/T</td>
</tr>
<tr>
<td style="text-align:right">4</td>
<td>—</td>
<td><code>H(3,2)</code> G/G</td>
<td><code>H(2,3)</code> C/T</td>
</tr>
<tr>
<td style="text-align:right">5</td>
<td>—</td>
<td>—</td>
<td><code>H(3,3)</code> G/T</td>
</tr>
</tbody>
</table>
<p>Rows move right with their <code>A</code> character.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="31" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-is-this-the-anti-diagonal-schedule">Why is this the anti-diagonal schedule?</h2>
<p>Cycle 3 computes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">H(3,1), H(2,2), H(1,3)
</code></pre>
<p>All satisfy:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">i + j = 4
</code></pre>
<p>The PE chain naturally generates one anti-diagonal per cycle.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="32" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="4--what-one-pe-must-remember">4 · What one PE must remember</h1>
<h2 id="follow-pe2-computing-h22">Follow PE2 computing H(2,2)</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="pe2-needs-three-predecessor-scores">PE2 needs three predecessor scores</h2>
<p>To compute <code>H(2,2)</code> in cycle 3:</p>
<ul>
<li><strong>above:</strong> <code>H(1,2)</code>—PE2 computed it in cycle 2</li>
<li><strong>left:</strong> <code>H(2,1)</code>—PE1 computed it in cycle 2</li>
<li><strong>diagonal:</strong> <code>H(1,1)</code>—PE1 computed it in cycle 1</li>
</ul>
<p>Where can each value come from?</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="above-stays-inside-the-pe">Above stays inside the PE</h2>
<p>PE2 computed <code>H(1,2)</code> in the previous cycle.</p>
<p>Store the most recent result in an <code>up</code> register:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">up = last score computed by this PE
</code></pre>
<p>For the next valid row, that value is directly above.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="left-arrives-from-the-previous-pe">Left arrives from the previous PE</h2>
<p>In cycle 2, PE1 computes <code>H(2,1)</code> and registers it.</p>
<p>In cycle 3, PE2 receives it as <code>left</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">left = score output of PE on the left
</code></pre>
<p>The register boundary prevents a long combinational path through the array.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="diagonal-is-the-previous-left-input">Diagonal is the previous left input</h2>
<p>One cycle earlier, PE2 received <code>H(1,1)</code> from PE1.</p>
<p>Save each left input in a <code>diag</code> register:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">diag = previous cycle’s left input
</code></pre>
<p>On the next row, it is the diagonally above-left score.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="inside-one-pe">Inside one PE</h2>
<div class="tc">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="38" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="pe-computation-in-plain-language">PE computation in plain language</h2>
<p>When a valid character arrives:</p>
<ol>
<li>compare it with this PE’s fixed <code>B</code> character,</li>
<li>form diagonal, above, and left candidate scores,</li>
<li>choose their maximum,</li>
<li>register the result and forward it,</li>
<li>remember the old left value as next cycle’s diagonal.</li>
</ol>
<p>All PEs do this simultaneously.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="pe-computation-as-pseudocode">PE computation as pseudocode</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">sub = (a == fixed_b) ? +2 : −1

score = max(diag + sub,
            up   − 2,
            left − 2)

at the clock edge:
    up       ← score
    diag     ← left
    char_out ← a
    score_out← score
</code></pre>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-hls-token-between-two-pes">The HLS token between two PEs</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;ap_int.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;hls_stream.h&gt;</span></span>

<span class="hljs-keyword">using</span> <span class="hljs-type">base_t</span>  = ap_uint&lt;<span class="hljs-number">2</span>&gt;;   <span class="hljs-comment">// A, C, G, T</span>
<span class="hljs-keyword">using</span> <span class="hljs-type">score_t</span> = ap_int&lt;<span class="hljs-number">16</span>&gt;;

<span class="hljs-keyword">struct</span> <span class="hljs-title class_">token_t</span> {
    <span class="hljs-type">base_t</span>  a;       <span class="hljs-comment">// row character moving right</span>
    <span class="hljs-type">score_t</span> left;    <span class="hljs-comment">// score produced by the left PE</span>
};
</code></pre>
<p>For now every stage reads exactly <code>m</code> tokens, so the bounded loop is the valid protocol.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-helper-for-the-three-candidates">A helper for the three candidates</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">static</span> <span class="hljs-type">score_t</span> <span class="hljs-title">max3</span><span class="hljs-params">(<span class="hljs-type">score_t</span> x,
                    <span class="hljs-type">score_t</span> y,
                    <span class="hljs-type">score_t</span> z)</span> </span>{
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS INLINE</span>
    <span class="hljs-type">score_t</span> m = (x &gt; y) ? x : y;
    <span class="hljs-keyword">return</span> (m &gt; z) ? m : z;
}
</code></pre>
<p>This becomes two levels of comparison logic.</p>
<p>The score type must be wide enough for the longest supported alignment.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="code-two" data-theme="fpga" lang="C" class="code-two" data-marpit-pagination="42" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:code-two;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="one-complete-pe-in-hls">One complete PE in HLS</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-keyword">template</span>&lt;<span class="hljs-type">int</span> J&gt;
<span class="hljs-type">void</span> <span class="hljs-title">pe</span><span class="hljs-params">(<span class="hljs-type">base_t</span> fixed_b, <span class="hljs-type">int</span> m,
        hls::stream&lt;<span class="hljs-type">token_t</span>&gt;&amp; in,
        hls::stream&lt;<span class="hljs-type">token_t</span>&gt;&amp; out)</span> </span>{
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS INLINE off</span>
    <span class="hljs-type">score_t</span> up   = <span class="hljs-number">-2</span> * (J + <span class="hljs-number">1</span>);  <span class="hljs-comment">// H(0,J+1)</span>
    <span class="hljs-type">score_t</span> diag = <span class="hljs-number">-2</span> * J;        <span class="hljs-comment">// H(0,J)</span>

    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; m; ++i) {
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
        <span class="hljs-type">token_t</span> x = in.<span class="hljs-built_in">read</span>();
        <span class="hljs-type">score_t</span> sub = (x.a == fixed_b) ? <span class="hljs-number">2</span> : <span class="hljs-number">-1</span>;
        <span class="hljs-type">score_t</span> score = <span class="hljs-built_in">max3</span>(diag + sub,
                             up - <span class="hljs-number">2</span>, x.left - <span class="hljs-number">2</span>);
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">        <span class="hljs-comment">// Forward the new cell</span>
        <span class="hljs-type">token_t</span> y;
        y.a    = x.a;
        y.left = score;
        out.<span class="hljs-built_in">write</span>(y);

        <span class="hljs-comment">// State for the next row</span>
        diag = x.left;
        up   = score;
    }
}
</code></pre>
<p>The old <code>up</code> and <code>diag</code> compute the score; the clock edge installs the new state.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="match-the-code-to-pe2-at-h22">Match the code to PE2 at H(2,2)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">fixed_b       G
x.a           C
x.left        H(2,1) = 0
up            H(1,2) = 0
diag          H(1,1) = 2
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">score = <span class="hljs-built_in">max3</span>(<span class="hljs-number">2</span> - <span class="hljs-number">1</span>, <span class="hljs-number">0</span> - <span class="hljs-number">2</span>, <span class="hljs-number">0</span> - <span class="hljs-number">2</span>);  <span class="hljs-comment">// 1</span>
diag  = x.left;                       <span class="hljs-comment">// save 0</span>
up    = score;                        <span class="hljs-comment">// save 1</span>
</code></pre>
<p>The HLS code is the recurrence with names that describe where values physically live.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="44" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="use-the-registers-for-h22">Use the registers for H(2,2)</h2>
<p>At PE2 in cycle 3:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">a       = C        fixed_b = G       sub = −1
up      = H(1,2) = 0
left    = H(2,1) = 0
diag    = H(1,1) = 2
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">score = max(2−1, 0−2, 0−2) = 1
</code></pre>
<p>This matches the software table.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="45" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="boundary-values-enter-through-pe1">Boundary values enter through PE1</h2>
<p>For row <code>i</code>, the matrix’s left boundary is:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">H(i,0) = −2i
</code></pre>
<p>Supply this value as PE1’s <code>left</code> input alongside <code>aᵢ</code>.</p>
<p>So the input stream contains both the character and its row-boundary score.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="46" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="initialize-each-pe-before-the-first-row">Initialize each PE before the first row</h2>
<p>For PE <code>j</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">up   = H(0,j)   = −2j
diag = H(0,j−1) = −2(j−1)
</code></pre>
<p>These are the top boundary values required by the first valid computation.</p>
<p>Then stream the rows.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="47" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="valid-travels-with-the-character">Valid travels with the character</h2>
<p>Each pipeline item carries:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">{ valid, character aᵢ, left score }
</code></pre>
<p>A PE updates <code>up</code> and <code>diag</code> only when <code>valid = 1</code>.</p>
<p>During fill, drain, or bubbles, invalid cycles must not corrupt the DP state.</p>
<p>The bounded HLS example has no bubbles: each stage reads exactly <code>m</code> valid tokens. A free-running design would carry an explicit <code>valid</code> bit.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="48" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="5--build-the-pe-chain-in-hls">5 · Build the PE chain in HLS</h1>
<h2 id="dataflow-makes-the-pes-run-concurrently">DATAFLOW makes the PEs run concurrently</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="49" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-input-process-creates-the-left-boundary">The input process creates the left boundary</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">load_rows</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">base_t</span> A[], <span class="hljs-type">int</span> m,
               hls::stream&lt;<span class="hljs-type">token_t</span>&gt;&amp; out)</span> </span>{
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; m; ++i) {
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
        <span class="hljs-type">token_t</span> x;
        x.a    = A[i];
        x.left = <span class="hljs-number">-2</span> * (i + <span class="hljs-number">1</span>);  <span class="hljs-comment">// H(i+1,0)</span>
        out.<span class="hljs-built_in">write</span>(x);
    }
}
</code></pre>
<p>PE1 receives one <code>A</code> character and the corresponding matrix boundary every cycle.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="50" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-four-pe-systolic-array">A four-PE systolic array</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">store_result</span><span class="hljs-params">(<span class="hljs-type">int</span> m, hls::stream&lt;<span class="hljs-type">token_t</span>&gt;&amp; in,
                  <span class="hljs-type">score_t</span>&amp; result)</span></span>;  <span class="hljs-comment">// defined next</span>

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">nw4</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">base_t</span> A[], <span class="hljs-type">const</span> <span class="hljs-type">base_t</span> B[<span class="hljs-number">4</span>],
         <span class="hljs-type">int</span> m, <span class="hljs-type">score_t</span>&amp; result)</span> </span>{
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
    hls::stream&lt;<span class="hljs-type">token_t</span>&gt; s0, s1, s2, s3, s4;
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS STREAM variable=s0 depth=2</span>
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS STREAM variable=s1 depth=2</span>
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS STREAM variable=s2 depth=2</span>
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS STREAM variable=s3 depth=2</span>
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS STREAM variable=s4 depth=2</span>

    <span class="hljs-built_in">load_rows</span>(A, m, s0);
    <span class="hljs-built_in">pe</span>&lt;<span class="hljs-number">0</span>&gt;(B[<span class="hljs-number">0</span>], m, s0, s1);
    <span class="hljs-built_in">pe</span>&lt;<span class="hljs-number">1</span>&gt;(B[<span class="hljs-number">1</span>], m, s1, s2);
    <span class="hljs-built_in">pe</span>&lt;<span class="hljs-number">2</span>&gt;(B[<span class="hljs-number">2</span>], m, s2, s3);
    <span class="hljs-built_in">pe</span>&lt;<span class="hljs-number">3</span>&gt;(B[<span class="hljs-number">3</span>], m, s3, s4);
    <span class="hljs-built_in">store_result</span>(m, s4, result);
}
</code></pre>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="51" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-output-process-keeps-the-last-row">The output process keeps the last row</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">store_result</span><span class="hljs-params">(<span class="hljs-type">int</span> m,
                  hls::stream&lt;<span class="hljs-type">token_t</span>&gt;&amp; in,
                  <span class="hljs-type">score_t</span>&amp; result)</span> </span>{
    <span class="hljs-type">token_t</span> x;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; m; ++i) {
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
        x = in.<span class="hljs-built_in">read</span>();
    }
    result = x.left;   <span class="hljs-comment">// H(m,4)</span>
}
</code></pre>
<p>The last token leaving PE4 contains the bottom-right score.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="52" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-dataflow-changes">What DATAFLOW changes</h2>
<p>The C calls appear one after another:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">load → PE1 → PE2 → PE3 → PE4 → store
</code></pre>
<p><code>#pragma HLS DATAFLOW</code> implements them as concurrent processes connected by FIFOs.</p>
<p>Each PE has its own <code>up</code> and <code>diag</code> state. A token advances one process per clock when all stages sustain <code>II=1</code>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="53" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-not-write-one-ordinary-loop-over-the-pes">Why not write one ordinary loop over the PEs?</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (j = <span class="hljs-number">0</span>; j &lt; <span class="hljs-number">4</span>; ++j)
    score = <span class="hljs-built_in">cell</span>(...);       <span class="hljs-comment">// misleading hardware schedule</span>
</code></pre>
<p>An unrolled loop can create a combinational chain from PE1 through PE4.</p>
<p>The stream-and-<code>DATAFLOW</code> structure makes the intended register boundary and independent PE state explicit.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="54" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="81">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="55" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-score-matrix-never-goes-to-memory">The score matrix never goes to memory</h2>
<p>The score-only design retains:</p>
<ul>
<li>one <code>up</code> score per PE,</li>
<li>one <code>diag</code> score per PE,</li>
<li>the score moving from each PE to its neighbour.</li>
</ul>
<p>It does not store all <code>m × n</code> cells.</p>
<p>Storage is <code>O(n)</code>, not <code>O(mn)</code>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="56" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="57" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="example-length-100">Example: length 100</h2>
<p>A software table contains:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">100 × 100 = 10,000 cell updates
</code></pre>
<p>With 100 PEs:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">latency = 100 + 100 − 1 = 199 cycles
</code></pre>
<p>At an illustrative 200 MHz: <code>199 × 5 ns ≈ 1 μs</code> of compute time.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="58" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="throughput-after-filling">Throughput after filling</h2>
<p>When all <code>n</code> PEs are active:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">n cell updates per cycle
</code></pre>
<p>At clock frequency <code>f</code>:</p>
<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -0.464ex; display: block; width: 100%; height: auto; max-height: 2.059ex;" xmlns="http://www.w3.org/2000/svg" width="19.667ex" height="2.059ex" role="img" focusable="false" viewBox="0 -705 8693 910"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mtext"><path data-c="70" d="M36 -148H50Q89 -148 97 -134V-126Q97 -119 97 -107T97 -77T98 -38T98 6T98 55T98 106Q98 140 98 177T98 243T98 296T97 335T97 351Q94 370 83 376T38 385H20V408Q20 431 22 431L32 432Q42 433 61 434T98 436Q115 437 135 438T165 441T176 442H179V416L180 390L188 397Q247 441 326 441Q407 441 464 377T522 216Q522 115 457 52T310 -11Q242 -11 190 33L182 40V-45V-101Q182 -128 184 -134T195 -145Q216 -148 244 -148H260V-194H252L228 -193Q205 -192 178 -192T140 -191Q37 -191 28 -194H20V-148H36ZM424 218Q424 292 390 347T305 402Q234 402 182 337V98Q222 26 294 26Q345 26 384 80T424 218Z"></path><path data-c="65" d="M28 218Q28 273 48 318T98 391T163 433T229 448Q282 448 320 430T378 380T406 316T415 245Q415 238 408 231H126V216Q126 68 226 36Q246 30 270 30Q312 30 342 62Q359 79 369 104L379 128Q382 131 395 131H398Q415 131 415 121Q415 117 412 108Q393 53 349 21T250 -11Q155 -11 92 58T28 218ZM333 275Q322 403 238 411H236Q228 411 220 410T195 402T166 381T143 340T127 274V267H333V275Z" transform="translate(556,0)"></path><path data-c="61" d="M137 305T115 305T78 320T63 359Q63 394 97 421T218 448Q291 448 336 416T396 340Q401 326 401 309T402 194V124Q402 76 407 58T428 40Q443 40 448 56T453 109V145H493V106Q492 66 490 59Q481 29 455 12T400 -6T353 12T329 54V58L327 55Q325 52 322 49T314 40T302 29T287 17T269 6T247 -2T221 -8T190 -11Q130 -11 82 20T34 107Q34 128 41 147T68 188T116 225T194 253T304 268H318V290Q318 324 312 340Q290 411 215 411Q197 411 181 410T156 406T148 403Q170 388 170 359Q170 334 154 320ZM126 106Q126 75 150 51T209 26Q247 26 276 49T315 109Q317 116 318 175Q318 233 317 233Q309 <footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="59" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-communication-scales-cleanly">Why communication scales cleanly</h2>
<p>Each PE talks only to its immediate neighbour.</p>
<p>There is no combinational path through all PEs:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1 → register → PE2 → register → PE3
</code></pre>
<p>The array grows by repeating the same local circuit.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="60" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-important-timing-constraint">The important timing constraint</h2>
<p>Within one PE:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">old up → candidate arithmetic → max → new up
</code></pre>
<p>The next row needs the new <code>up</code> value on the next cycle.</p>
<p>This feedback recurrence limits how deeply we can pipeline one PE.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="61" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-an-extra-pe-pipeline-stage-is-not-free">Why an extra PE pipeline stage is not free</h2>
<p>If a cell result takes two cycles, the next row arrives before its <code>above</code> score is ready.</p>
<p>Then one PE cannot accept a new row every cycle.</p>
<p>Possible remedies include:</p>
<ul>
<li>lower the clock,</li>
<li>accept a larger initiation interval, or</li>
<li>interleave independent alignments.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="62" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="5c--what-if-b-is-longer-than-the-array">5c · What if B is longer than the array?</h1>
<h2 id="reuse-p-physical-pes-over-blocks-of-p-columns">Reuse P physical PEs over blocks of P columns</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="63" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="example-eight-columns-four-pes">Example: eight columns, four PEs</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">physical array:  PE1  PE2  PE3  PE4

pass 0:          B1   B2   B3   B4
pass 1:          B5   B6   B7   B8
</code></pre>
<p>During each pass, stream every character of <code>A</code> through the four PEs.</p>
<p>The array computes one vertical strip of the DP matrix at a time.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="64" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-must-cross-between-strips">What must cross between strips?</h2>
<p>Strip 1 needs the rightmost score from strip 0 for <strong>every row</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">H(1,4), H(2,4), ..., H(m,4)
</code></pre>
<p>These values become the left inputs for columns 5–8:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">PE1 left input for row i = H(i,4)
</code></pre>
<p>We save one boundary column—not the entire completed strip.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="65" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="boundary-buffers">Boundary buffers</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">before pass 0:
    prev[i] = H(i,0) = −2i

pass 0 computes columns 1..4:
    next[i] = H(i,4)

swap(prev,next)

pass 1 computes columns 5..8:
    next[i] = H(i,8)
</code></pre>
<p>Two buffers allow one to be read while the other is written.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="66" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="pe-initialization-now-uses-the-global-column">PE initialization now uses the global column</h2>
<p>On a pass beginning at zero-based column <code>base</code>, physical PE <code>J</code> owns:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">global column j = base + J + 1
</code></pre>
<p>Initialize:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">score_t</span> up   = <span class="hljs-number">-2</span> * j;       <span class="hljs-comment">// H(0,j)</span>
<span class="hljs-type">score_t</span> diag = <span class="hljs-number">-2</span> * (j - <span class="hljs-number">1</span>); <span class="hljs-comment">// H(0,j-1)</span>
</code></pre>
<p>Using only physical <code>J</code> would incorrectly restart the top boundary at every strip.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="67" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-block-wrapper-changes-two-endpoints">The block wrapper changes two endpoints</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">load_block</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">base_t</span> A[], <span class="hljs-type">const</span> <span class="hljs-type">score_t</span> prev[],
                <span class="hljs-type">int</span> m, hls::stream&lt;<span class="hljs-type">token_t</span>&gt;&amp; out)</span> </span>{
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; m; ++i) {
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
        <span class="hljs-type">token_t</span> x;
        x.a = A[i]; x.left = prev[i];
        out.<span class="hljs-built_in">write</span>(x);
    }
}

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">save_block</span><span class="hljs-params">(<span class="hljs-type">int</span> m, hls::stream&lt;<span class="hljs-type">token_t</span>&gt;&amp; in,
                <span class="hljs-type">score_t</span> next[])</span> </span>{
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; m; ++i) {
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
        next[i] = in.<span class="hljs-built_in">read</span>().left;
    }
}
</code></pre>
<p>Inside the block, the same PE chain is reused unchanged except for global-column initialization.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="68" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="outer-loop-over-column-blocks">Outer loop over column blocks</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">score_t</span> boundary[<span class="hljs-number">2</span>][MAX_M];

<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; m; ++i)
    boundary[<span class="hljs-number">0</span>][i] = <span class="hljs-number">-2</span> * (i + <span class="hljs-number">1</span>); <span class="hljs-comment">// column zero</span>

<span class="hljs-type">int</span> blocks = (n + P - <span class="hljs-number">1</span>) / P;
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> b = <span class="hljs-number">0</span>; b &lt; blocks; ++b) {
    <span class="hljs-type">int</span> rd = b &amp; <span class="hljs-number">1</span>, wr = rd ^ <span class="hljs-number">1</span>;
    <span class="hljs-type">int</span> base = b * P;
    <span class="hljs-built_in">nw_block</span>&lt;P&gt;(A, &amp;B[base], m, base,
                boundary[rd], boundary[wr]);
}

result = boundary[blocks &amp; <span class="hljs-number">1</span>][m - <span class="hljs-number">1</span>];
</code></pre>
<p>Conceptually this is correct. In hardware, <code>prev</code> and <code>next</code> may be BRAM, URAM, or external memory depending on <code>m</code>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="69" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="cost-of-a-longer-b">Cost of a longer B</h2>
<p>With <code>P</code> physical PEs and <code>K = ceil(n/P)</code> column blocks:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">approximately K passes over A
boundary storage: m scores
cell updates remain: m × n
</code></pre>
<p>Peak work per cycle is still <code>P</code> cells, but the boundary must be stored and replayed between passes.</p>
<p>The last partial block needs only its active columns; it must not score padded dummy symbols.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="70" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="6--build-this-first">6 · Build this first</h1>
<h2 id="four-pes-tiny-strings-visible-state">Four PEs, tiny strings, visible state</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="71" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="minimal-first-implementation">Minimal first implementation</h2>
<p>Build four PEs with:</p>
<ul>
<li>programmable fixed <code>B</code> characters,</li>
<li>fixed scoring <code>+2 / −1 / −2</code>,</li>
<li>score-only output,</li>
<li><code>valid</code>, character, and score propagation,</li>
<li>explicit initialization before each pair.</li>
</ul>
<p>Limit both test strings to four symbols initially.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="72" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="verification-strategy">Verification strategy</h2>
<p>For each cycle, compare hardware against a software DP matrix:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">expected cell coordinates
expected aᵢ and bⱼ
expected up, left, and diag
expected output score
</code></pre>
<p>Do not verify only the final score; several wrong cells can accidentally produce the same final answer.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="73" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="test-cases">Test cases</h2>
<p>Use tiny cases whose behavior is obvious:</p>
<ul>
<li>identical strings: <code>ACGT / ACGT</code></li>
<li>all mismatches: <code>AAAA / CCCC</code></li>
<li>one gap is best: <code>ACGT / AGT</code></li>
<li>length one</li>
<li>different lengths</li>
<li>reset followed immediately by another alignment</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="74" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="invariants-worth-asserting">Invariants worth asserting</h2>
<ul>
<li>PE <code>j</code> always stores <code>B[j]</code>.</li>
<li>A valid item advances exactly one PE per cycle.</li>
<li>PE <code>j</code> computes only column <code>j</code>.</li>
<li><code>diag</code> receives the prior valid <code>left</code> value.</li>
<li>an invalid cycle does not update DP state.</li>
<li>the last PE’s final valid output equals software <code>H(m,n)</code>.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="75" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="reference-checkpoint-longer-b">Reference checkpoint: longer B</h2>
<p>Section 5c developed the complete mechanism:</p>
<ol>
<li>process <code>P</code> columns,</li>
<li>save the right-boundary score for every row,</li>
<li>use that boundary as the next strip's left input,</li>
<li>reinitialize each PE using its <strong>global</strong> column number.</li>
</ol>
<p>The crucial state between passes is one boundary column, not the whole DP strip.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="76" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="only-after-this-works-affine-gaps">Only after this works: affine gaps</h2>
<p>A fixed gap cost cannot distinguish opening a gap from extending it.</p>
<p>Affine gaps add two states:</p>
<ul>
<li>best score ending in a horizontal gap,</li>
<li>best score ending in a vertical gap.</li>
</ul>
<p>The PE structure remains recognizable, but carries more state.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="77" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="only-after-this-works-traceback">Only after this works: traceback</h2>
<p>The score <code>H(m,n)</code> says how good the best alignment is.</p>
<p>To recover the aligned strings, store which candidate won at each cell:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">diagonal, above, or left → 2 bits per cell
</code></pre>
<p>This changes storage from <code>O(n)</code> score state to <code>O(mn)</code> direction state.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="78" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="score-first-alignment-later">Score first; alignment later</h2>
<p>For a first FPGA implementation:</p>
<ol>
<li>prove the cycle schedule,</li>
<li>prove the PE state updates,</li>
<li>prove score equivalence,</li>
<li>scale the PE count,</li>
<li>then consider affine gaps and traceback.</li>
</ol>
<p class="question"><strong>Do not add the hard memory problem before the systolic computation is correct.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="79" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="final-mental-model">Final mental model</h2>
<div class="pipeline"><span>B character<br />stays</span><b>+</b><span>A character<br />moves</span><b>+</b><span>above<br />stays</span><b>+</b><span>left score<br />moves</span><b>→</b><span>one new<br />cell</span></div>
<p>One column becomes one PE.</p>
<p>Successive rows become successive cycles.</p>
<p>Anti-diagonal parallelism emerges from the pipeline.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="80" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="81">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="takeaways">Takeaways</h2>
<ol>
<li>A DP cell needs diagonal, above, and left scores.</li>
<li>One PE owns one column and is reused across rows.</li>
<li>Keep <code>B[j]</code> and <code>above</code> in the PE; stream <code>A[i]</code> and <code>left</code> rightward.</li>
<li>Save the previous left input to obtain the diagonal.</li>
<li>Registered neighbor links produce one anti-diagonal per cycle.</li>
<li>Score-only storage is linear in the number of PEs.</li>
<li>With <code>n</code> PEs, compute latency is <code>m+n−1</code> cycles.</li>
</ol>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-class="title" data-theme="fpga" lang="C" class="title" style="--class:title;--theme:fpga;">
<h1 id="one-column-%E2%86%92-one-pe">One column → one PE</h1>
<h2 id="keep-one-value--receive-two-values--compute-one-cell--pass-the-wave-onward">Keep one value · receive two values · compute one cell · pass the wave onward</h2>
</section>

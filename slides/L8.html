</tbody>
</table>
<p>Sidhu and Prasanna showed that regex NFAs can be mapped directly into FPGA spatial logic, exploiting concurrent state activity.</p>
<p class="ref"><a href="https://dblp.org/rec/conf/fccm/SidhuP01">Sidhu and Prasanna, “Fast Regular Expression Matching Using FPGAs,” FCCM 2001</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="47" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="regex-is-not-just-longer-strings">Regex is not “just longer strings”</h2>
<p>Regular expressions introduce:</p>
<ul>
<li>character classes: <code>[A-Za-z]</code></li>
<li>alternation: <code>GET|POST</code></li>
<li>repetition: <code>a+</code>, <code>.{0,32}</code>, bounded counts</li>
<li>anchors and protocol-sensitive context</li>
<li>many simultaneous candidate paths</li>
</ul>
<p>Automata may suffer:</p>
<ul>
<li>DFA state explosion</li>
<li>NFA active-state/routing cost</li>
<li>expensive counters for bounded repetition</li>
<li>worst-case traffic engineered to activate many paths</li>
</ul>
<p class="ref">Overview: <a href="https://ieeexplore.ieee.org/document/7468531/">Xu et al., “A Survey on Regular Expression Matching for DPI,” IEEE Communications Surveys & Tutorials, 2016</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="48" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="filter-first-verify-rarely">Filter first, verify rarely</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">all traffic → cheap literal / hash filter → candidate rule IDs
                                      ↓
                             expensive regex verifier
</code></pre>
<ul>
<li>Select literals that are necessary for a regex to match.</li>
<li>Use exact string engines, Bloom filters, hashes, or small automata as prefilters.</li>
<li>Route only candidate packets/rules to costly verification.</li>
<li>Provision for adversarial traffic that defeats the filter.</li>
</ul>
<p>Hyperscan decomposes regexes into string and automata components on CPUs. Pigasus similarly uses FPGA multi-string matching to reduce expensive downstream work.</p>
<p class="ref"><a href="https://www.usenix.org/system/files/nsdi19-wang-xiang.pdf">Wang et al., Hyperscan, NSDI 2019</a> · <a href="https://www.usenix.org/system/files/osdi20-zhao_zhipeng.pdf">Zhao et al., Pigasus, OSDI 2020</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="49" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="runtime-rule-updates-change-the-architecture">Runtime rule updates change the architecture</h2>
<p>Compile-time constants provide efficient logic but require a new bitstream to change signatures.</p>
<p>Runtime-update choices:</p>
<ul>
<li>transition/rule tables in BRAM/URAM</li>
<li>inactive shadow bank, then atomic bank swap</li>
<li>versioned rule sets carried with packet context</li>
<li>partial reconfiguration of matcher regions</li>
<li>CPU slow path while hardware tables update</li>
</ul>
<p>Correctness requirement:</p>
<blockquote>
<p>Every packet must be evaluated against one coherent ruleset version—not half old and half new.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="50" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="stateful-inspection-is-per-flow-computation">Stateful inspection is per-flow computation</h2>
<p>Packet-local matching resets at <code>last</code>. Flow-aware matching retains state across packets:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">context = flow_table[flow_key];
context.automaton_state = <span class="hljs-built_in">scan</span>(payload, context.automaton_state);
flow_table[flow_key] = context;
</code></pre>
<p>Now the bottlenecks include:</p>
<ul>
<li>flow lookup and hash collisions</li>
<li>concurrent updates to the same flow</li>
<li>context memory bandwidth</li>
<li>eviction, timeout, and state migration</li>
<li>packets of one flow arriving out of order</li>
</ul>
<p>Different flows are parallel; successive bytes/packets of the same flow are dependent.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="51" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="tcp-reassembly-precedes-stream-inspection">TCP reassembly precedes stream inspection</h2>
<p>A signature can cross packet boundaries, while TCP may deliver:</p>
<ul>
<li>segmentation at arbitrary byte positions</li>
<li>retransmissions</li>
<li>gaps and out-of-order segments</li>
<li>overlapping segments</li>
<li>connection establishment/termination state</li>
</ul>
<p>A true TCP-stream IDS needs:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">5-tuple lookup → sequence validation → reorder/reassembly → byte stream → matcher
</code></pre>
<p>Pigasus is important because it treats IDS as a stateful system problem—not merely a comparator benchmark—and targets 100 Gb/s with 100K+ concurrent connections and 10K+ rules.</p>
<p class="ref"><a href="https://www.usenix.org/system/files/osdi20-zhao_zhipeng.pdf">Zhao et al., Pigasus, OSDI 2020</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="52" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="pigasus-the-useful-reality-check">Pigasus: the useful reality check</h2>
<p>Pigasus takes an FPGA-first approach:</p>
<ul>
<li>packet parsing and flow tracking on FPGA</li>
<li>TCP reassembly/state management on FPGA</li>
<li>multi-string pattern matching as a major hardware filter</li>
<li>selected complex processing on CPU cores</li>
<li>carefully banked/partitioned memories for common-case line rate</li>
</ul>
<p>Reported goal/result: 100-Gb/s IDS/IPS on one server, over 100K flows and 10K rules, using one FPGA and an average of five CPU cores in evaluated traces.</p>
<blockquote>
<p>The architectural lesson is not “put everything in FPGA.” It is “make the common path bounded, regular, and local; export sparse complexity.”</p>
</blockquote>
<p class="ref"><a href="https://www.usenix.org/conference/osdi20/presentation/zhao-zhipeng">Pigasus paper, slides, and talk</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="53" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="7--dataflow-the-complete-inspector">7 · Dataflow the complete inspector</h1>
<h2 id="every-stage-needs-a-rate-state-and-failure-contract">Every stage needs a rate, state, and failure contract</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="54" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="persistent-task-graph">Persistent task graph</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">inspector</span><span class="hljs-params">(axis_stream&amp; rx, axis_stream&amp; tx,
               <span class="hljs-type">rule_mem_t</span>&amp; rules, <span class="hljs-type">stats_t</span>&amp; stats)</span> </span>{
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-built_in">receive_and_buffer</span>(rx, packet_store, desc_rx);
  <span class="hljs-built_in">parse_packets</span>(desc_rx, payload_beats, parsed_meta);
  <span class="hljs-built_in">match_payload</span>(payload_beats, match_events);
  <span class="hljs-built_in">decide</span>(parsed_meta, match_events, decisions);
  <span class="hljs-built_in">emit_or_drop</span>(packet_store, decisions, tx, stats);
}
</code></pre>
<ul>
<li>Functions remain live across many packets.</li>
<li>Streams carry ownership, data, or metadata—not shared mutable ambiguity.</li>
<li>Packet ID joins asynchronous branches.</li>
<li>Each loop’s steady-state II must satisfy its offered rate.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="55" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="write-a-contract-for-every-channel">Write a contract for every channel</h2>
<p>For each producer→consumer edge record:</p>
<table>
<thead>
<tr>
<th>Property</th>
<th>Question</th>
</tr>
</thead>
<tbody>
<tr>
<td>token</td>
<td>beat, byte, packet descriptor, event, or rule ID?</td>
</tr>
<tr>
<td>rate</td>
<td>tokens produced/consumed per beat or packet?</td>
</tr>
<tr>
<td>burst</td>
<td>maximum short-term imbalance?</td>
</tr>
<tr>
<td>depth</td>
<td>how much skew can the FIFO absorb?</td>
</tr>
<tr>
<td>framing</td>
<td>how are start/end and invalid bytes represented?</td>
</tr>
<tr>
<td>ownership</td>
<td>who frees packet or flow state?</td>
</tr>
<tr>
<td>failure</td>
<td>stall, drop, retry, or exception?</td>
</tr>
</tbody>
</table>
<p>This table is often more valuable than the first HLS implementation.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="56" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="fork-and-join-hazards">Fork and join hazards</h2>
<p>Parser metadata and payload matching proceed at different rates:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">                ┌→ metadata path ─────────┐
packet ID + data                           ├→ decision
                └→ payload matcher ───────┘
</code></pre>
<p>Potential failures:</p>
<ul>
<li>one branch drops a token; join deadlocks</li>
<li>results return out of order</li>
<li>metadata FIFO fills while matcher waits elsewhere</li>
<li>packet IDs wrap while old packets remain in flight</li>
</ul>
<p>Use explicit IDs, bounded outstanding counts, and assertions that every fork produces exactly one matching join event—or a defined cancellation.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="57" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="clock-domain-crossings">Clock-domain crossings</h2>
<p>The transceiver/MAC, HLS kernel, PCIe, and memory controller may run at different clocks.</p>
<p>CDC requires:</p>
<ul>
<li>asynchronous FIFOs for multi-bit streaming data</li>
<li>synchronized resets and link-up sequencing</li>
<li>gray-coded pointers/verified FIFO IP—not hand-sampled buses</li>
<li>capacity for clock-ratio drift and bursts</li>
</ul>
<p>Rate conversion example:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">MAC: 512 bits @ 200 MHz  →  internal: 256 bits @ 400 MHz
</code></pre>
<p>Equal nominal bit rate does not remove phase and burst buffering requirements.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="58" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="memory-placement-by-role">Memory placement by role</h2>
<table>
<thead>
<tr>
<th>State</th>
<th>Likely implementation</th>
</tr>
</thead>
<tbody>
<tr>
<td>15-byte beat halo</td>
<td>registers</td>
</tr>
<tr>
<td>fixed constants / small NFA</td>
<td>LUTs + registers</td>
</tr>
<tr>
<td>transition tables</td>
<td>BRAM/URAM</td>
</tr>
<tr>
<td>per-flow context</td>
<td>banked BRAM/URAM or external memory</td>
</tr>
<tr>
<td>packet buffering</td>
<td>URAM/HBM/DDR depending capacity</td>
</tr>
<tr>
<td>counters</td>
<td>banked/on-chip, periodically drained</td>
</tr>
</tbody>
</table>
<p>Apply the same L5 questions:</p>
<ol>
<li>accesses per cycle</li>
<li>independent addresses or wide groups</li>
<li>working-set capacity</li>
<li>overlap and placement</li>
</ol>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="59" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="worst-casenot-average-casesets-safety">Worst case—not average case—sets safety</h2>
<p>Average candidate count can justify a hybrid fast/slow path, but adversaries choose traffic.</p>
<p>Ask:</p>
<ul>
<li>Can every packet trigger every candidate rule?</li>
<li>Can hashes be collision-flooded?</li>
<li>Can automata enter high-activity states repeatedly?</li>
<li>Can one flow serialize a bank or lock?</li>
<li>What happens when the CPU exception queue fills?</li>
</ul>
<p>Possible policies:</p>
<ul>
<li>overprovision for a proven bound</li>
<li>rate-limit expensive classes</li>
<li>fail-open versus fail-closed</li>
<li>shed load with auditable counters</li>
<li>isolate tenants and flows</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="60" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="8--verification-and-measurement">8 · Verification and measurement</h1>
<h2 id="a-line-rate-result-needs-more-evidence-than-c-simulation-passed">A line-rate result needs more evidence than “C simulation passed”</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="61" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="functional-corner-cases">Functional corner cases</h2>
<p>Minimum test set:</p>
<ul>
<li>match at first and last legal byte</li>
<li>match crossing every beat boundary alignment</li>
<li>overlapping matches and multiple rule hits</li>
<li>packets shorter than the signature</li>
<li>empty/partial final beat and every <code>keep</code> pattern allowed</li>
<li>back-to-back packets with no idle cycle</li>
<li>reset/link interruption mid-packet</li>
<li>malformed headers and parser truncation</li>
<li>rule update during traffic</li>
<li>packet with bad FCS/error indication</li>
</ul>
<p>Compare against a byte-accurate software golden model with randomized framing.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="62" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="performance-verification">Performance verification</h2>
<p>Measure separately:</p>
<ul>
<li>maximum sustained Gb/s by packet size</li>
<li>packets/s for minimum frames</li>
<li>first-byte and full-packet decision latency</li>
<li>backpressure cycles at every interface</li>
<li>FIFO high-water marks and drops</li>
<li>worst-case candidate/automaton activity</li>
<li>memory-bank conflicts and achieved burst efficiency</li>
<li>clock frequency after place-and-route—not only HLS estimate</li>
</ul>
<p>For a no-loss claim, run adversarial full-rate traffic longer than the largest buffering time constant.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="63" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="useful-assertions">Useful assertions</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">accepted RX bytes = forwarded + dropped + buffered
allocated slots   = freed slots + currently owned slots
every packet ID produces exactly one terminal action
history is empty at start of every packet
no match lane reads an invalid byte
FIFO occupancy never exceeds configured depth
ruleset version is constant for one packet
</code></pre>
<p>Assertions turn architectural invariants into checkable properties in simulation and formal tools.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="64" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="resource-and-timing-evidence">Resource and timing evidence</h2>
<p>Record after each transformation:</p>
<ul>
<li>LUT/FF/BRAM/URAM/DSP utilization</li>
<li>inferred memories, width, depth, replication, and banking</li>
<li>requested versus achieved II, including limiting reason</li>
<li>critical path and fanout</li>
<li>dataflow timeline and channel stalls</li>
<li>routing congestion and post-route frequency</li>
<li>power estimate or measured board power</li>
</ul>
<blockquote>
<p>A paper-quality throughput number must state width, clock, packet/rule workload, boundary semantics, and whether it is peak or sustained.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="65" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="9--research-map">9 · Research map</h1>
<h2 id="where-the-clean-classroom-pipeline-becomes-an-open-problem">Where the clean classroom pipeline becomes an open problem</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="66" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-1--multi-byte-automata">Research problem 1 — multi-byte automata</h2>
<p><strong>Question:</strong> sustain 64 input bytes/cycle without replicating a complete automaton 64 times.</p>
<p>Directions:</p>
<ul>
<li>compressed composed transitions</li>
<li>speculative state traversal</li>
<li>bit-split automata and alphabet reduction</li>
<li>automaton partitioning across memory banks</li>
<li>exploit rule structure to bound active states</li>
<li>dynamically choose scalar/wide engine by flow or rule group</li>
</ul>
<p>Evaluation must include resource scaling, update cost, post-route frequency, and adversarial inputs—not only average throughput.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="67" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-2--elastic-hybrid-scheduling">Research problem 2 — elastic hybrid scheduling</h2>
<p><strong>Question:</strong> how should an FPGA filter and schedule candidate work to a limited pool of regex engines or CPU cores?</p>
<p>Directions:</p>
<ul>
<li>candidate-aware work queues</li>
<li>shortest/cheapest-rule-first scheduling</li>
<li>traffic-adaptive engine allocation</li>
<li>admission control with security semantics</li>
<li>bounds when every packet defeats the prefilter</li>
</ul>
<p>Pigasus motivates sparse CPU offload; newer on-demand regex work asks how to invoke only relevant automata rather than sending every packet through every engine.</p>
<p class="ref"><a href="https://doi.org/10.1145/3774651">“On-Demand Regular Expression Matching on FPGAs for Efficient DPI,” ACM TRETS</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="68" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-3--updateable-hardware-rules">Research problem 3 — updateable hardware rules</h2>
<p><strong>Question:</strong> achieve logic-like performance with table-like runtime updates.</p>
<p>Directions:</p>
<ul>
<li>double-buffered tables with atomic cutover</li>
<li>incremental automaton updates</li>
<li>partial reconfiguration with uninterrupted service</li>
<li>rule placement/packing as an optimization problem</li>
<li>multi-tenant versioning and isolation</li>
<li>verify semantic equivalence before activation</li>
</ul>
<p>Tradeoff triangle:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">throughput / density ↔ update latency ↔ expressive rule language
</code></pre>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="69" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-4--flow-state-at-100%E2%80%93400-gbs">Research problem 4 — flow state at 100–400 Gb/s</h2>
<p><strong>Question:</strong> maintain millions of mutable flow contexts without serializing hot flows or exhausting on-chip memory.</p>
<p>Directions:</p>
<ul>
<li>bank-aware hashing and skew handling</li>
<li>cache hierarchy for flow context</li>
<li>optimistic/speculative updates</li>
<li>per-flow ordering across parallel pipelines</li>
<li>state migration during scaling or partial reconfiguration</li>
<li>attack-resistant timeout and eviction</li>
</ul>
<p>The fundamental tension is random per-flow access versus wide sequential packet bandwidth.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="70" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-5--encrypted-traffic">Research problem 5 — encrypted traffic</h2>
<p>TLS/QUIC encrypt most application payload, so a passive byte-signature matcher cannot see plaintext.</p>
<p>Research directions:</p>
<ul>
<li>endpoint-cooperative inspection before encryption/after decryption</li>
<li>offloaded TLS termination with strict key isolation</li>
<li>privacy-preserving matching / searchable encryption</li>
<li>metadata and traffic-analysis classifiers</li>
<li>confidential-computing boundaries for NIC accelerators</li>
<li>verifiable policies limiting what inspection can reveal</li>
</ul>
<p>This is not merely a performance problem: threat model, privacy, key ownership, and false positives define correctness.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="71" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-6--safe-programmability">Research problem 6 — safe programmability</h2>
<p><strong>Question:</strong> let users deploy packet functions without breaking line rate, isolation, or liveness.</p>
<p>Directions:</p>
<ul>
<li>compile-time rate/resource guarantees</li>
<li>bounded loops and memory accesses</li>
<li>tenant isolation for shared tables and queues</li>
<li>compositional deadlock verification</li>
<li>hot updates with state continuity</li>
<li>portable packet-processing IRs and HLS scheduling</li>
</ul>
<p>ClickNP, NICA, and Rosebud explore different hardware/software interfaces and ways to compose accelerators with packet pipelines.</p>
<p class="ref"><a href="https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/main-4.pdf">ClickNP, SIGCOMM 2016</a> · <a href="https://www.usenix.org/system/files/atc19-eran.pdf">NICA, ATC 2019</a> · <a href="https://arxiv.org/abs/2201.08978">Rosebud</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="72" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-7--verification-under-overload">Research problem 7 — verification under overload</h2>
<p><strong>Question:</strong> prove the inspector remains safe when buffers fill, rules change, links reset, and traffic is adversarial.</p>
<p>Directions:</p>
<ul>
<li>formal conservation/ownership properties</li>
<li>automatic worst-case FIFO-depth analysis</li>
<li>network-calculus bounds for burst propagation</li>
<li>equivalence between software rules and compiled hardware</li>
<li>fail-open/fail-closed policy verification</li>
<li>telemetry that distinguishes attack from implementation overload</li>
</ul>
<p>A functional matcher can still be an unsafe inline system if overload behavior is unspecified.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="73" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="research-problem-8--benchmark-honestly">Research problem 8 — benchmark honestly</h2>
<p>A useful benchmark suite should vary:</p>
<ul>
<li>packet sizes, gaps, and port mixtures</li>
<li>real and adversarial payloads</li>
<li>rule count, length, overlap, and regex complexity</li>
<li>flow count, skew, reordering, and retransmission</li>
<li>update frequency</li>
<li>match density and candidate explosion</li>
</ul>
<p>Report sustained throughput, p99 latency, drops, energy/bit, post-route resources, and semantic coverage. A synthetic all-nonmatching trace measures only one corner.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="74" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="10--reading-path">10 · Reading path</h1>
<h2 id="foundational-algorithms-%E2%86%92-packet-pipelines-%E2%86%92-fpga-systems-%E2%86%92-modern-ids">Foundational algorithms → packet pipelines → FPGA systems → modern IDS</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="dense" data-theme="fpga" lang="C" class="dense" data-marpit-pagination="75" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:dense;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="core-papers--read-in-this-order">Core papers — read in this order</h2>
<ol>
<li><strong>Aho &amp; Corasick, 1975.</strong> “Efficient String Matching: An Aid to Bibliographic Search.” Multi-pattern automaton foundation.<br />
<a href="https://cr.yp.to/bib/1975/aho.pdf">https://cr.yp.to/bib/1975/aho.pdf</a></li>
<li><strong>Sidhu &amp; Prasanna, FCCM 2001.</strong> “Fast Regular Expression Matching Using FPGAs.” Spatial NFA mapping.<br />
<a href="https://dblp.org/rec/conf/fccm/SidhuP01">https://dblp.org/rec/conf/fccm/SidhuP01</a></li>
<li><strong>Bosshart et al., SIGCOMM 2013.</strong> “Forwarding Metamorphosis.” Parser/match-action pipeline and RMT.<br />
<a href="https://conferences.sigcomm.org/sigcomm/2013/papers/sigcomm/p99.pdf">https://conferences.sigcomm.org/sigcomm/2013/papers/sigcomm/p99.pdf</a></li>
<li><strong>Li et al., SIGCOMM 2016.</strong> “ClickNP.” HLS-style modular FPGA network functions.<br />
<a href="https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/main-4.pdf">https://www.microsoft.com/en-us/research/wp-content/uploads/2016/07/main-4.pdf</a></li>
<li><strong>Firestone et al., NSDI 2018.</strong> “Azure Accelerated Networking.” Production FPGA SmartNIC architecture.<br />
<a href="https://www.usenix.org/system/files/conference/nsdi18/nsdi18-firestone.pdf">https://www.usenix.org/system/files/conference/nsdi18/nsdi18-firestone.pdf</a></li>
</ol>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="dense" data-theme="fpga" lang="C" class="dense" data-marpit-pagination="76" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:dense;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="dpi-and-smartnic-systems">DPI and SmartNIC systems</h2>
<ol start="6">
<li><strong>Wang et al., NSDI 2019.</strong> “Hyperscan.” Regex decomposition and high-performance CPU matching.<br />
<a href="https://www.usenix.org/system/files/nsdi19-wang-xiang.pdf">https://www.usenix.org/system/files/nsdi19-wang-xiang.pdf</a></li>
<li><strong>Eran et al., ATC 2019.</strong> “NICA.” Inline application kernels on FPGA NICs.<br />
<a href="https://www.usenix.org/system/files/atc19-eran.pdf">https://www.usenix.org/system/files/atc19-eran.pdf</a></li>
<li><strong>Zhao et al., OSDI 2020.</strong> “Pigasus.” FPGA-first 100-Gb/s IDS/IPS.<br />
<a href="https://www.usenix.org/system/files/osdi20-zhao_zhipeng.pdf">https://www.usenix.org/system/files/osdi20-zhao_zhipeng.pdf</a></li>
<li><strong>Khazraee et al.</strong> “Rosebud.” Framework for FPGA-accelerated middleboxes.<br />
<a href="https://arxiv.org/abs/2201.08978">https://arxiv.org/abs/2201.08978</a></li>
<li><strong>Wang et al., ATC 2022.</strong> “FpgaNIC.” A versatile 100-Gb SmartNIC architecture.<br />
<a href="https://www.usenix.org/system/files/atc22-wang-zeke.pdf">https://www.usenix.org/system/files/atc22-wang-zeke.pdf</a></li>
</ol>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="77" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="documentation-and-survey">Documentation and survey</h2>
<ul>
<li><strong>AMD PG203:</strong> Integrated 100G Ethernet Subsystem—PHY/MAC modes, LBUS/AXI user interfaces, framing and cut-through behavior.<br />
<a href="https://docs.amd.com/r/en-US/pg203-cmac-usplus/Product-Specification">https://docs.amd.com/r/en-US/pg203-cmac-usplus/Product-Specification</a></li>
<li><strong>Arm AXI4-Stream specification:</strong> ready/valid stream semantics. Use the version distributed with the course/tool installation.</li>
<li><strong>Xu et al., 2016:</strong> “A Survey on Regular Expression Matching for Deep Packet Inspection: Applications, Algorithms, and Hardware Platforms.”<br />
<a href="https://ieeexplore.ieee.org/document/7468531/">https://ieeexplore.ieee.org/document/7468531/</a></li>
<li><strong>Yu, 2006:</strong> “High Speed Deep Packet Inspection with Hardware Support.” Algorithms/data structures for DPI.<br />
<a href="https://digicoll.lib.berkeley.edu/record/133254/files/EECS-2006-156.pdf">https://digicoll.lib.berkeley.edu/record/133254/files/EECS-2006-156.pdf</a></li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="78" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-complete-design-checklist">The complete design checklist</h2>
<ol>
<li>Define inspected bytes and exact match semantics.</li>
<li>Convert link rate to bytes/cycle and packets/cycle.</li>
<li>Specify framing, partial beats, errors, and backpressure.</li>
<li>Choose history/state scope: beat, packet, or flow.</li>
<li>Choose matcher: comparators, AC, DFA/NFA, or filter+verify.</li>
<li>Decide store-and-forward versus cut-through behavior.</li>
<li>Design packet/metadata ownership and fork/join IDs.</li>
<li>Budget ports, memory, buffering, and post-route timing.</li>
<li>Define overload and rule-update behavior.</li>
<li>Verify boundaries, adversarial cases, sustained rate, and conservation invariants.</li>
</ol>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="79" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-through-line">The through-line</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">software array                     inline spatial system
────────────────────────────────────────────────────────────────
nested loops          →            persistent pipeline
re-read 16 bytes       →            retain a 15-byte halo
early return           →            framed OR-reduction
one byte/cycle         →            512-bit beats
packet-local state     →            flow context + reassembly
function result        →            forward/drop/mirror action
average runtime        →            worst-case rate contract
</code></pre>
<blockquote>
<p>The matcher is a component. The research challenge is a correct, updateable, adversarially robust system that never loses the wire.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-class="title" data-theme="fpga" lang="C" class="title" style="--class:title;--theme:fpga;">
<h1 id="from-bytes-to-decisionsat-line-rate">From bytes to decisions—at line rate</h1>
<h2 id="retain-state--expose-parallelism--bound-every-queue--specify-every-failure">Retain state · expose parallelism · bound every queue · specify every failure</h2>
<p><strong>Next artifact:</strong> a programming homework that grows the design from a scalar reference model to a framed wide-stream inspector.</p>

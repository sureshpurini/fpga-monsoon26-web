<h1 id="line-rate-packet-inspection-on-fpgas">Line-Rate Packet Inspection on FPGAs</h1>
<h2 id="from-serial-bits-on-the-wire-to-a-spatial-streaming-matcher">From serial bits on the wire to a spatial streaming matcher</h2>
<p><strong>A complete case study:</strong> interface · parsing · matching · buffering · actions · research frontiers</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="2" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-problem">The problem</h2>
<p>A SmartNIC must inspect every 1500-byte packet for any of:</p>
<ul>
<li><strong>64 fixed signatures</strong></li>
<li><strong>16 bytes per signature</strong></li>
<li><strong>100-Gb/s line rate</strong></li>
<li>FPGA clock: <strong>300 MHz</strong></li>
<li>Worst case: scan the complete packet</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt;= LEN-SLEN; i++)
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> s = <span class="hljs-number">0</span>; s &lt; NSIG; s++)
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> k = <span class="hljs-number">0</span>; k &lt; SLEN; k++)
      match &amp;= pkt[i+k] == sig[s][k];
</code></pre>
<blockquote>
<p>The input is written as an array. On the NIC, it arrives as an unstoppable stream.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="3" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-this-lecture-will-build">What this lecture will build</h2>
<p>By the end, we will have designed and challenged this pipeline:</p>
<div class="pipeline"><span>100G PHY<br />+ MAC</span><b>→</b><span>packet<br />parser</span><b>→</b><span>payload<br />aligner</span><b>→</b><span>pattern<br />matcher</span><b>→</b><span>policy<br />action</span><b>→</b><span>buffer /<br />egress</span></div>
<p>We will answer four kinds of question:</p>
<ol>
<li><strong>Rate:</strong> can every stage accept the offered bytes and packets?</li>
<li><strong>State:</strong> what history is required across beats, packets, and flows?</li>
<li><strong>Semantics:</strong> when is it safe to forward, drop, or alert?</li>
<li><strong>Scale:</strong> what happens when 64 fixed strings become 10,000 mixed rules?</li>
</ol>

<h2 id="line-rate-is-also-a-packet-rate-contract">Line rate is also a packet-rate contract</h2>
<p>Large packets stress <strong>byte throughput</strong>; minimum packets stress <strong>per-packet work</strong>.</p>
<p>On Ethernet, a minimum 64-byte frame also consumes preamble/SFD and an interpacket gap on the wire. The familiar 100-GbE worst-case rate is about <strong>148.8 million packets/s</strong>.</p>

<h2 id="latency-and-throughput-are-different-promises">Latency and throughput are different promises</h2>
<ul>
<li><strong>Latency:</strong> time from first RX byte to decision or first TX byte.</li>
<li><strong>Throughput:</strong> long-run rate of accepted beats/packets.</li>
<li>A 40-stage pipeline can have high latency but still sustain one beat/cycle.</li>
<li>A 2-stage block with <code>II=2</code> eventually loses half the offered traffic.</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="from-the-cable-to-user-logic">From the cable to user logic</h2>
<div class="pipeline"><span>optics /<br />copper</span><b>→</b><span>SerDes<br />lanes</span><b>→</b><span>PCS +<br />FEC</span><b>→</b><span>Ethernet<br />MAC</span><b>→</b><span>512-bit<br />stream</span><b>→</b><span>your<br />logic</span></div>
<ul>
<li><strong>SerDes:</strong> converts high-speed serial lanes to parallel words.</li>
<li><strong>PCS:</strong> coding, block alignment, lane distribution/alignment; optional RS-FEC.</li>
<li><strong>MAC:</strong> frame boundary, FCS handling/checking, pause/control, statistics.</li>
<li><strong>User interface:</strong> packet data plus valid-byte and end-of-packet information.</li>
</ul>
<p>AMD’s integrated 100G Ethernet subsystem offers a 512-bit segmented LBUS and an optional 512-bit AXI4-Stream user interface; RX is designed for cut-through delivery with minimal internal buffering.</p>
<p class="ref">Source: AMD PG203, <a href="https://docs.amd.com/r/en-US/pg203-cmac-usplus/Typical-Operation">Typical Operation</a> and <a href="https://docs.amd.com/r/en-US/pg203-cmac-usplus/User-Side-LBUS-Interface">User-side LBUS</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-packet-arrives-as-beats">A packet arrives as beats</h2>
<p>Conceptual AXI4-Stream word:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">axis_word</span> {
  ap_uint&lt;<span class="hljs-number">512</span>&gt; data;  <span class="hljs-comment">// up to 64 packet bytes</span>
  ap_uint&lt;<span class="hljs-number">64</span>&gt;  keep;  <span class="hljs-comment">// one validity bit per byte</span>
  ap_uint&lt;<span class="hljs-number">1</span>&gt;   last;  <span class="hljs-comment">// this beat ends the packet</span>
  <span class="hljs-type">metadata_t</span>   user;  <span class="hljs-comment">// error/status/port/timestamp as designed</span>
};
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">beat 0       bytes   0 ...  63     keep = all ones
beat 1       bytes  64 ... 127     keep = all ones
...
last beat    remaining bytes       keep = valid-byte mask, last = 1
</code></pre>
<p>The exact sidebands are platform-specific; the semantics—data, validity, boundary, metadata—are universal.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="readyvalid-is-a-transfer-contract">Ready/valid is a transfer contract</h2>
<p>For AXI-style streaming, a beat transfers only when:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">tvalid &amp;&amp; tready
</code></pre>
<ul>
<li>Source asserts <code>valid</code> when a beat is available.</li>
<li>Sink asserts <code>ready</code> when it can accept a beat.</li>
<li>If the inspector lowers <code>ready</code>, pressure propagates toward RX buffering.</li>
<li>When buffering fills: apply flow control, shed/drop traffic, or violate service.</li>
</ul>
<p class="warn"><strong>Inline rule:</strong> “I can stall” is not a throughput design. State exactly where stalled bytes go and how much time that storage buys.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="inline-lookaside-and-host-paths">Inline, lookaside, and host paths</h2>
<table>
<thead>
<tr>
<th>Placement</th>
<th>Packet path</th>
<th>Consequence</th>
</tr>
</thead>
<tbody>
<tr>
<td>Inline / bump-in-the-wire</td>
<td>port → FPGA → port</td>
<td>lowest host load; must sustain wire</td>
</tr>
<tr>
<td>SmartNIC inline to host</td>
<td>port → FPGA → PCIe/host</td>
<td>inspect/steer before DMA</td>
</tr>
<tr>
<td>Lookaside accelerator</td>
<td>NIC/CPU → FPGA → CPU</td>
<td>easier integration; extra movement/latency</td>
</tr>
<tr>
<td>Hybrid fast/slow path</td>
<td>common case FPGA; exception CPU</td>
<td>scale regular work, retain flexibility</td>
</tr>
</tbody>
</table>
<p>NICA calls FPGA application logic placed directly in the network data path an <strong>inline kernel</strong>. Pigasus uses an FPGA-first common path and sends selected expensive work to CPU cores.</p>
<p class="ref"><a href="https://www.usenix.org/system/files/atc19-eran.pdf">Eran et al., NICA, ATC 2019</a> · <a href="https://www.usenix.org/system/files/osdi20-zhao_zhipeng.pdf">Zhao et al., Pigasus, OSDI 2020</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<li>Data plane: bounded work on every beat.</li>
<li>Control plane: rules, statistics, health, exceptional decisions.</li>
<li>Packet bytes and metadata often take different paths and must remain associated.</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="parse-before-inspecting">Parse before inspecting</h2>
<p>The byte offset of “payload” is not constant:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Ethernet | VLAN? | IPv4 options? / IPv6 extensions? | TCP options? | payload
</code></pre>
<p>Parser output typically includes:</p>
<ul>
<li>L2/L3/L4 protocol and header offsets</li>
<li>source/destination addresses and ports—the flow key</li>
<li>payload start and valid length</li>
<li>fragmentation, checksum, and error flags</li>
<li>action metadata carried beside the packet</li>
</ul>
<p>The RMT model made <strong>parser → match-action pipeline → queues</strong> the canonical programmable-switch architecture.</p>
<p class="ref"><a href="https://conferences.sigcomm.org/sigcomm/2013/papers/sigcomm/p99.pdf">Bosshart et al., “Forwarding Metamorphosis: Fast Programmable Match-Action Processing in Hardware for SDN,” SIGCOMM 2013</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="packet-bytes-and-metadata-travel-differently">Packet bytes and metadata travel differently</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">packet stream ───────────────→ packet buffer ───────────→ egress
       │                            ↑                         ↑
       └→ parser → matchers → decision metadata ─────────────┘
</code></pre>
<ul>
<li>Bytes are wide and expensive to duplicate.</li>
<li>Metadata is narrow and convenient to pipeline.</li>
<li>The packet may wait in memory while its decision is computed.</li>
<li>Use a packet ID/descriptor to join the decision with the correct buffered bytes.</li>
<li>Preserve ordering—or explicitly support reordering with sequence information.</li>
</ul>
<blockquote>
<p>“Inspect” is not the whole architecture. The result must control the correct packet.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="18" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="3--build-the-fixed-string-matcher">3 · Build the fixed-string matcher</h1>
<h2 id="convert-nested-loops-into-retained-state-and-spatial-reductions">Convert nested loops into retained state and spatial reductions</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="first-target-one-new-byte-per-cycle">First target: one new byte per cycle</h2>
<p>For a 16-byte signature, retain the last 16 bytes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> k = <span class="hljs-number">0</span>; k &lt; <span class="hljs-number">15</span>; k++)
  window[k] = window[k<span class="hljs-number">+1</span>];
window[<span class="hljs-number">15</span>] = in_byte;
</code></pre>
<p>Implemented as a shift register:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">new byte → [b15][b14] ... [b2][b1][b0] → discard
                         16-byte window
</code></pre>
<ul>
<li>Only <strong>one new packet byte</strong> is read per cycle.</li>
<li>The previous 15 bytes are reused from registers.</li>
<li>After filling, one new window becomes available each cycle.</li>
</ul>
<blockquote>
<p>This is temporal reuse converted into spatial state.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="one-signature-becomes-a-comparator-tree">One signature becomes a comparator tree</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">match_one</span><span class="hljs-params">(<span class="hljs-type">const</span> byte window[<span class="hljs-number">16</span>], <span class="hljs-type">const</span> byte sig[<span class="hljs-number">16</span>])</span> </span>{
  <span class="hljs-type">bool</span> eq[<span class="hljs-number">16</span>];
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=eq complete</span>
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> k=<span class="hljs-number">0</span>; k&lt;<span class="hljs-number">16</span>; k++) {
    <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS UNROLL</span>
    eq[k] = (window[k] == sig[k]);
  }
  <span class="hljs-keyword">return</span> and_reduce(eq);
}
</code></pre>
<p>Hardware:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">16 byte equality comparators → balanced AND tree → signature_match
</code></pre>
<p>Pipeline the tree if its combinational delay misses the clock. Latency grows; II can remain 1.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="sixty-four-signatures-become-spatial-lanes">Sixty-four signatures become spatial lanes</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">bool</span> hit[<span class="hljs-number">64</span>];
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=hit complete</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> s=<span class="hljs-number">0</span>; s&lt;<span class="hljs-number">64</span>; s++) {
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS UNROLL</span>
  hit[s] = <span class="hljs-built_in">match_one</span>(window, signatures[s]);
}
<span class="hljs-type">bool</span> any_hit = or_reduce(hit);
</code></pre>
<p>Nominal logic:</p>
<ul>
<li><code>64 × 16 = 1024</code> eight-bit equality comparisons</li>
<li>64 sixteen-input AND reductions</li>
<li>one 64-input OR reduction</li>
<li>pipeline registers and high-fanout distribution of the window</li>
</ul>
<p>Fixed build-time signatures may be constants in logic—not necessarily 1024 independently read memory bytes.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-a-naive-array-still-creates-a-port-wall">Why a naive array still creates a port wall</h2>
<p>If HLS maps <code>sig[64][16]</code> to one or a few RAMs, the unrolled design requests 1024 signature bytes in the same cycle.</p>
<p>Possible layouts:</p>
<ul>
<li>Compile signatures as constants in generated logic.</li>
<li>Complete-partition a small fixed table into registers.</li>
<li>Reshape each 16-byte signature into a 128-bit word and replicate/bank by signature lane.</li>
<li>Time-multiplex matcher lanes if area matters—but recompute the achievable rate.</li>
</ul>
<blockquote>
<p><code>UNROLL</code> creates consumers. Storage layout must create matching delivery bandwidth.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="23" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="remove-the-early-return">Remove the early return</h2>
<p>Software control:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">if</span> (current_window_match)
  <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
</code></pre>
<p>Streaming state:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">packet_match |= current_window_match;
<span class="hljs-keyword">if</span> (end_of_packet) {
  <span class="hljs-built_in">emit</span>(packet_match | current_window_match);
  packet_match = <span class="hljs-literal">false</span>;
}
</code></pre>
<ul>
<li>Always consume the complete packet at a regular rate.</li>
<li>Carry an accumulated match bit—or a vector of matched rule IDs.</li>
<li>Reset state exactly at the packet boundary.</li>
</ul>
<blockquote>
<p>Data-dependent termination becomes a reduction over a framed stream.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="fill-steady-state-and-drain">Fill, steady state, and drain</h2>
<p>For a 16-byte window:</p>
<ul>
<li>First 15 bytes: history is incomplete; suppress matches.</li>
<li>From byte 15 onward: one complete window per accepted byte.</li>
<li>At <code>last</code>: include the last valid window, emit result, clear state.</li>
<li>Next packet: never combine old history with new bytes.</li>
</ul>
<p>If a final wide beat has only <code>r</code> valid bytes, generate only the window starts whose complete 16 bytes belong to the current packet.</p>
<p class="question"><strong>Verification target:</strong> signatures beginning 15 bytes before a beat boundary and ending in the next beat.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="what-does-a-match-mean">What does a match mean?</h2>
<p>Possible outputs have very different costs:</p>
<table>
<thead>
<tr>
<th>Output</th>
<th>State/logic implication</th>
</tr>
</thead>
<tbody>
<tr>
<td>any signature matched</td>
<td>one packet flag</td>
</tr>
<tr>
<td>first rule ID</td>
<td>priority encoder + ordering convention</td>
</tr>
<tr>
<td>all matching rule IDs</td>
<td>bit vector or event stream</td>
</tr>
<tr>
<td>match offset</td>
<td>byte-position counter + event metadata</td>
</tr>
<tr>
<td>count per rule</td>
<td>concurrent counter updates / banking</td>
</tr>
</tbody>
</table>
<p>Define overlap semantics too: if a signature occurs twice, do we report twice? If several signatures end at one byte, which IDs are emitted?</p>
<blockquote>
<p>Specify observable behavior before optimizing the matcher.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-first-complete-one-byte-pipeline">The first complete one-byte pipeline</h2>
<div class="pipeline"><span>byte +<br />boundary</span><b>→</b><span>16-byte<br />history</span><b>→</b><span>64 × 16<br />compare</span><b>→</b><span>AND / OR<br />tree</span><b>→</b><span>packet<br />result</span></div>
<p>Per accepted byte:</p>
<ol>
<li>Shift one byte into local history.</li>
<li>Compare the current window with all fixed signatures.</li>
<li>Pipeline reductions.</li>
<li>OR the result into packet state.</li>
<li>On packet end, emit and reset.</li>
</ol>
<p>This can achieve <code>II=1</code>—but at 300 MHz it is still only 2.4 Gb/s.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="a-wide-beat-creates-many-new-windows">A wide beat creates many new windows</h2>
<p>Let stream width be <code>B=64</code> bytes and signature length <code>L=16</code>.</p>
<p>Each cycle retain <code>L−1=15</code> history bytes and append 64 new bytes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">              previous tail                 current beat
extended = [ 15 history bytes ][             64 new bytes             ]
             &lt;-------------------- 79 bytes --------------------------&gt;
</code></pre>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-the-15-byte-halo-is-mandatory">Why the 15-byte halo is mandatory</h2>
<p>Suppose a signature begins at byte 60 of one 64-byte beat:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">beat n:       ... [60 61 62 63]
beat n+1:     [64 65 ... 75] ...
signature:        &lt;------ 16 bytes ------&gt;
</code></pre>
<ul>
<li>It is absent from either beat considered alone.</li>
<li>The concatenated history + current beat exposes it as one contiguous window.</li>
<li>This is the same halo/overlap principle used in stencil and tiled image kernels.</li>
</ul>
<blockquote>
<p>Wide interfaces change boundary handling, not the definition of the algorithm.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>

225 -22 199 -14T143 16T92 75T56 172T42 313ZM257 397Q227 397 205 380T171 335T154 278T148 216Q148 133 160 97T198 39Q222 21 251 21Q302 21 329 59Q342 77 347 104T352 209Q352 289 347 316T329 361Q302 397 257 397Z" transform="translate(2278,0)"></path></g></g></g></svg></mjx-container></p><p>byte equalities per cycle.</p>
<p>The wide design also needs:</p>
<ul>
<li>fanout of 79 input bytes to many comparator lanes</li>
<li>4096 signature-match reductions per beat</li>
<li>rule/offset encoding for simultaneous hits</li>
<li>pipeline registers to meet timing</li>
</ul>
<p>This is valid spatial hardware—but likely not the best architecture.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="four-ways-to-scale-the-wide-matcher">Four ways to scale the wide matcher</h2>
<ol>
<li><strong>Replicate positions:</strong> maximum determinism, maximum logic/routing.</li>
<li><strong>Replicate flows:</strong> one sequential engine per independent flow; packet scheduling supplies independence.</li>
<li><strong>Multi-byte transitions:</strong> precompute <code>δⁿ(state, word)</code>; table size can explode.</li>
<li><strong>Filter then verify:</strong> cheap literals/hashes/Bloom filters produce a small candidate set for expensive engines.</li>
</ol>
<p>The right choice depends on:</p>
<ul>
<li>ruleset size and update frequency</li>
<li>traffic distribution and adversarial worst case</li>
<li>exact strings versus regular expressions</li>
<li>available LUT/BRAM/URAM and required clock</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="valid-byte-and-boundary-logic">Valid-byte and boundary logic</h2>
<p>For each beat, the matcher must know:</p>
<ul>
<li><code>start_of_packet</code> or equivalent internal state</li>
<li>valid-byte count from <code>keep</code></li>
<li>payload offset: header bytes may be excluded</li>
<li><code>last</code>: no windows may cross into the next packet</li>
<li>malformed/error policy</li>
</ul>
<p>For a partial final beat, a lane is enabled only if all <code>L</code> bytes of its window are valid payload bytes from this packet.</p>
<p class="warn"><strong>Common bug:</strong> zero-padding invalid bytes and still enabling the comparator creates false matches involving padding.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="one-stream-multiple-packets-in-a-wide-beat">One stream, multiple packets in a wide beat?</h2>
<p>Interfaces differ:</p>
<ul>
<li>Some packet buses carry at most one packet fragment per beat.</li>
<li>Segmented buses can end one packet and begin another in the same wide cycle.</li>
<li>Multiple physical ports may be interleaved into one internal pipeline.</li>
</ul>
<p>A segmented matcher needs independent:</p>
<ul>
<li>histories per segment/packet context</li>
<li>start/end masks</li>
<li>accumulated match state</li>
<li>result association</li>
</ul>
<blockquote>
<p>Never infer the framing model from data width alone; read the MAC/user-interface contract.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="timing-closure-becomes-an-architectural-problem">Timing closure becomes an architectural problem</h2>
<p>The logic count is only half the story:</p>
<ul>
<li>A 79-byte window has enormous fanout.</li>
<li>Flat 16- and 64-way reductions create long paths.</li>
<li>Rule-ID priority selection can become critical.</li>
<li>Wide crossbars and arbitrary routing dominate LUT delay.</li>
</ul>
<p>Responses:</p>
<ul>
<li>register and replicate input distribution trees</li>
<li>balance/pipeline Boolean reductions</li>
<li>floorplan matcher groups near their local constants/RAMs</li>
<li>partition rules into parallel clusters and merge narrow results</li>
<li>avoid a global priority encoder unless semantics require one</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="35" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="5--store-forward-dropor-speculate">5 · Store, forward, drop—or speculate?</h1>
<h2 id="a-late-decision-cannot-retract-bytes-already-transmitted">A late decision cannot retract bytes already transmitted</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-late-match-problem">The late-match problem</h2>
<p>Suppose policy says “drop any matching packet,” and the match occurs in the final 16 bytes.</p>
<p>If TX began when RX began:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">RX: [---------------- packet ----------------][decision]
TX:       [------------- already sent -------------]
</code></pre>
<p>The FPGA cannot recall transmitted Ethernet bytes.</p>
<p>Therefore a security action needs an explicit forwarding semantic:</p>
<ul>
<li>buffer until decision</li>
<li>tolerate speculative forwarding</li>
<li>or restrict inspection/action to an early prefix</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="three-forwarding-architectures">Three forwarding architectures</h2>
<table>
<thead>
<tr>
<th>Architecture</th>
<th style="text-align:right">First-byte latency</th>
<th style="text-align:right">Memory</th>
<th>Can drop on late match?</th>
</tr>
</thead>
<tbody>
<tr>
<td>Store-and-forward</td>
<td style="text-align:right">≥ packet reception</td>
<td style="text-align:right">full packet(s)</td>
<td>yes</td>
</tr>
<tr>
<td>Cut-through</td>
<td style="text-align:right">small pipeline latency</td>
<td style="text-align:right">elastic only</td>
<td>no</td>
</tr>
<tr>
<td>Hybrid / speculative</td>
<td style="text-align:right">low common case</td>
<td style="text-align:right">policy-dependent</td>
<td>limited / exceptional</td>
</tr>
</tbody>
</table>
<p>Store-and-forward data path:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">RX → packet memory ───────────────→ read/forward or release/drop
       └→ inspector → decision ────────────────┘
</code></pre>
<p>Buffer capacity must cover decision latency, contention, and bursts—not just one packet.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="38" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<ul>
<li><code>D = 1 μs</code> → 100 kbit ≈ 12.5 KB</li>
<li><code>D = 10 μs</code> → 1 Mbit ≈ 125 KB</li>

<p>Then add queueing, arbitration, headroom, and multiple ports/traffic classes.</p>
<blockquote>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="descriptor-based-packet-storage">Descriptor-based packet storage</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">RX writer: allocate slot → write beats → enqueue descriptor
inspector:  consume beats/metadata → write decision[packet_id]
egress:     descriptor + decision → forward/drop/mirror → free slot
</code></pre>
<p>A descriptor might contain:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">{ packet_id, buffer_addr, length, ingress_port,
  parsed_headers, flow_id, error_flags, timestamp }
</code></pre>
<p>Design questions:</p>
<ul>
<li>Who owns a slot at each time?</li>
<li>What happens if metadata finishes before packet write—or vice versa?</li>
<li>How are drops and exceptions guaranteed to free storage?</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="actions-are-another-pipeline">Actions are another pipeline</h2>
<p>Inspection may trigger:</p>
<ul>
<li><strong>forward</strong> unchanged or to a selected port/queue</li>
<li><strong>drop</strong> and increment counters</li>
<li><strong>mirror</strong> a copy to monitoring software</li>
<li><strong>mark/rewrite</strong> header fields</li>
<li><strong>rate-limit</strong> a flow or class</li>
<li><strong>exception</strong> to host software for deeper analysis</li>
</ul>
<p>Match-action pipelines separate key extraction, table lookup, and action execution so each stage can remain regular and deeply pipelined.</p>
<p class="ref"><a href="https://conferences.sigcomm.org/sigcomm/2013/papers/sigcomm/p99.pdf">RMT, SIGCOMM 2013</a> · <a href="https://www.usenix.org/system/files/conference/nsdi18/nsdi18-firestone.pdf">Firestone et al., AccelNet, NSDI 2018</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="backpressure-must-terminate-somewhere">Backpressure must terminate somewhere</h2>
<p>Trace a blocked TX port backward:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">TX blocked → egress queue fills → packet store cannot release
           → RX allocation stalls → ingress FIFO fills → then what?
</code></pre>
<p>Options:</p>
<ul>
<li>provision queues for expected bursts</li>
<li>Ethernet pause/PFC where operationally acceptable</li>
<li>drop according to explicit policy</li>
<li>isolate ports/queues so one blocked destination cannot stop all traffic</li>
<li>credit-based scheduling and admission control</li>
</ul>
<p>Head-of-line blocking and losslessness are system policies, not properties supplied by HLS.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="aho%E2%80%93corasick-shares-prefixes">Aho–Corasick shares prefixes</h2>
<p>Build one trie-like pattern machine for all strings, adding failure transitions and output sets.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">state = <span class="hljs-built_in">transition</span>(state, byte);
matches |= <span class="hljs-built_in">output</span>(state);
</code></pre>
<ul>
<li>One pass over the input.</li>
<li>Work per byte need not test every pattern independently.</li>
<li>Shared prefixes occupy shared states.</li>
<li>Determinized transition tables trade compute for memory.</li>
</ul>
<p>The original algorithm constructs a finite-state pattern-matching machine and reports all occurrences of a finite keyword set.</p>
<p class="ref"><a href="https://cr.yp.to/bib/1975/aho.pdf">Aho and Corasick, “Efficient String Matching: An Aid to Bibliographic Search,” CACM 1975</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="44" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="80">

9T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g></g><g data-mml-node="mo" transform="translate(5959.8,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container></p><p>Byte <code>i+1</code> cannot select its transition until byte <code>i</code> produces the next state.</p>
<p>This is a true loop-carried RAW dependence:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">state_i → transition(byte_i) → state_i+1 → transition(byte_i+1)
</code></pre>
<p>Replicating transition units does not make one flow’s bytes independent.</p>
<p>Possible parallelism:</p>
<ul>
<li>different flows/packets with separate states</li>
<li>composed multi-byte transitions</li>
<li>speculative states with later selection</li>
<li>alternative NFA/bit-parallel representations</li>
</ul>

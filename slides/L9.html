</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="81" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="throughput-is-a-second-contract">Throughput is a second contract</h2>
<p>A pipeline may have 500 ns latency and still accept one event per cycle.</p>
<p>A 50 ns block with <code>II=4</code> may build an ever-growing queue under a sustained one-event-per-cycle input.</p>
<p>For every stage specify:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">latency · initiation interval · burst capacity · backpressure policy
</code></pre>
<p>Both average and worst-case event mixes matter.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="82" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="7--make-the-closed-loop-trustworthy">7 · Make the closed loop trustworthy</h1>
<h2 id="correctness-recovery-and-measurement-are-architectural-features">Correctness, recovery, and measurement are architectural features</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="83" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-useful-verification-ladder">A useful verification ladder</h2>
<ol>
<li>software reference book from the same event trace,</li>
<li>parser tests with real packet captures,</li>
<li>C/RTL co-simulation of every event kind,</li>
<li>replay at target rate with sequence gaps and malformed packets,</li>
<li>compare book snapshots and every emitted order,</li>
<li>measure on-board timestamps at RX and TX boundaries.</li>
</ol>
<p>Never validate only the final best bid/ask; latent corruption may sit deeper in the book.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="84" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="corner-cases-worth-designing-first">Corner cases worth designing first</h2>
<ul>
<li>cancel unknown/already-cancelled order ID,</li>
<li>modify price and quantity simultaneously,</li>
<li>partial fill versus complete removal,</li>
<li>both sides changed by one trade,</li>
<li>empty side of book,</li>
<li>replacement level far beyond the first mask chunk,</li>
<li>sequence gap during a burst,</li>
<li>arithmetic overflow in aggregate quantity,</li>
<li>risk reject while another order is in flight.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="85" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-safety-assertions">The safety assertions</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">book quantity never underflows
topCache is sorted
topCache equals the first D occupied mask positions
no outbound order bypasses risk
outbound sequence/order IDs never repeat
position includes fills exactly once
</code></pre>
<p>Assertions convert financial correctness requirements into properties at precise hardware boundaries.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="86" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="fail-open-or-fail-closed">Fail-open or fail-closed?</h2>
<p>If market state becomes suspect after a sequence gap:</p>
<ul>
<li>continuing to trade risks decisions on an incorrect book,</li>
<li>stopping protects state but may leave live orders exposed,</li>
<li>cancelling outstanding orders requires a functioning order channel.</li>
</ul>
<p>There is no universal answer—but the policy must be explicit, testable, and reachable without host timing assumptions.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="87" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="honest-performance-evidence">Honest performance evidence</h2>
<p>Report at least:</p>
<ul>
<li>clock frequency after place-and-route,</li>
<li>latency distribution by message type,</li>
<li>worst observed and architecturally bounded latency,</li>
<li>sustained events/s and adversarial bursts,</li>
<li>queue occupancy and overflow behavior,</li>
<li>FPGA resources and memory bandwidth,</li>
<li>exact timestamp endpoints.</li>
</ul>
<p>“Kernel latency” and “wire-to-wire latency” are different results.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="88" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="8--read-the-paper-with-an-architects-eye">8 · Read the paper with an architect’s eye</h1>
<h2 id="what-it-contributes-assumes-and-leaves-for-the-next-design">What it contributes, assumes, and leaves for the next design</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="89" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-papers-central-idea">The paper’s central idea</h2>
<p>Use four complementary structures:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">HBM allOrders     → identify old order state
URAM orderBook    → direct full price-level update
bit mask          → locate occupied levels
register topCache → immediate market depth
</code></pre>
<p>Then optimize the hard cache-refill operation for the empirical fact that the next occupied level is usually nearby.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="90" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-this-is-a-good-fpga-case-study">Why this is a good FPGA case study</h2>
<p>The speedup does not come from translating a software tree literally.</p>
<p>It comes from co-designing:</p>
<ul>
<li>representation with the market’s fixed tick,</li>
<li>memory placement with access frequency,</li>
<li>a hot cache with decision requirements,</li>
<li>search structure with observed data locality,</li>
<li>task boundaries with the packet stream.</li>
</ul>
<p>This is exactly what “architecture” means in HLS.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="91" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-the-paper-does-not-claim">What the paper does not claim</h2>
<p>It does not present a complete profitable trading strategy.</p>
<p>It does not measure full exchange round-trip time.</p>
<p>It does not remove the need for feed recovery, risk controls, or host supervision.</p>
<p>It provides a low-latency, continuously current <strong>market-state substrate</strong> on which those components can be built.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="92" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="reading-path">Reading path</h2>
<ol>
<li><strong>Kashera et al., FPL 2023</strong> — today’s order-book architecture.</li>
<li><strong>Leber, Geib, and Litz, FPL 2011</strong> — hardware feed decoding and trading acceleration.</li>
<li><strong>He et al., FPL 2017</strong> — clipped-tree FPGA order-book update.</li>
<li><strong>Boutros et al., ReConFig 2017</strong> — HLS-based FPGA HFT and heap structures.</li>
<li><strong>NSE MTBT specification</strong> — the protocol contract behind the packets.</li>
</ol>
<p class="ref"><a href="https://ieeexplore.ieee.org/document/10296447">Kashera et al.</a> · <a href="https://doi.org/10.1109/FPL.2011.64">Leber et al.</a> · references [3–4] in the anchor paper · <a href="https://archives.nseindia.com/content/press/Realtime_CM_CD_TBT.pdf">NSE MTBT</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="93" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-complete-mental-model">The complete mental model</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">wire bytes
  → typed market event
  → consistent multi-view order book
  → small current feature vector
  → prediction
  → strategy intent
  → hard risk gate
  → encoded order bytes
  → wire
</code></pre>
<p>Every arrow is a channel contract. Every box owns state, latency, throughput, and failure behavior.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="94" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-through-line">The through-line</h2>
<p>The market sends <strong>events</strong>, not a ready-made book.</p>
<p>The order book is <strong>reconstructed state</strong>, not merely a sorted array.</p>
<p>Low latency comes from keeping the hot path <strong>streaming, local, and predictable</strong>.</p>
<p>Closing the loop means prediction, strategy, risk, and order transmission must join the same bounded pipeline.</p>
<blockquote>
<p>Do not accelerate one function. Architect the complete feedback loop.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-class="title" data-theme="fpga" lang="C" class="title" style="--class:title;--theme:fpga;">

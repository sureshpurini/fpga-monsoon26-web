<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-question-for-today">The question for today</h2>
<p>An exchange changes its order book.</p>
<p>How quickly can our machine:</p>
<ol>
<li>learn what changed,</li>
<li>reconstruct the new market state,</li>
<li>decide whether to act, and</li>
<li>place an order back on the wire?</li>
</ol>
<p class="question"><strong>The clock starts at the incoming packet—not at our C function.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="start-with-one-limit-order">Start with one limit order</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">BUY  100 shares  at ₹100.00 or lower
</code></pre>
<p>This order says:</p>
<ul>
<li><strong>side:</strong> buy</li>
<li><strong>quantity:</strong> 100</li>
<li><strong>limit price:</strong> the most this buyer will pay</li>
<li><strong>order ID:</strong> the identity used later to modify or cancel it</li>
</ul>
<p>The exchange stores unmatched orders in a <strong>limit order book</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="sellers-make-the-other-side">Sellers make the other side</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">SELL 150 shares  at ₹100.50 or higher
</code></pre>
<ul>
<li>Buyers compete by offering a <strong>higher</strong> price.</li>
<li>Sellers compete by asking a <strong>lower</strong> price.</li>
<li>The exchange gives priority according to its matching rules.</li>
</ul>
<p>For our hardware, the first essential ordering is by <strong>price level</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="bid-and-askfrom-whose-point-of-view">Bid and ask—from whose point of view?</h2>
<ul>
<li>A bid for 100 shares at ₹100 means: “I will <strong>buy</strong> 100 shares, paying at most ₹100.”</li>
<li>The <strong>highest bid</strong>, ₹100, is the best price available if you want to <strong>sell now</strong>.</li>
<li>An ask for 150 shares at ₹100.50 means: “I will <strong>sell</strong> 150 shares, receiving at least ₹100.50.”</li>
<li>The <strong>lowest ask</strong>, ₹100.50, is the best price available if you want to <strong>buy now</strong>.</li>
</ul>
<p class="question"><strong>Useful intuition:</strong> the bid is what you can sell for now; the ask is what you can buy for now.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

8T28 218ZM333 275Q322 403 238 411H236Q228 411 220 410T195 402T166 381T143 340T127 274V267H333V275Z" transform="translate(1504,0)"></path><path data-c="65" d="M28 218Q28 273 48 318T98 391T163 433T229 448Q282 448 320 430T378 380T406 316T415 245Q415 238 408 231H126V216Q126 68 226 36Q246 30 270 30Q312 30 342 62Q359 79 369 104L379 128Q382 131 395 131H398Q415 131 415 121Q415 117 412 108Q393 53 349 21T250 -11Q155 -11 92 58T28 218ZM333 275Q322 403 238 411H236Q228 411 220 410T195 402T166 381T143 340T127 274V267H333V275Z" transform="translate(1948,0)"></path><path data-c="73" d="M295 316Q295 356 268 385T190 414Q154 414 128 401Q98 382 98 349Q97 344 98 336T114 312T157 287Q175 282 201 278T245 269T277 256Q294 248 310 236T342 195T359 133Q359 71 321 31T198 -10H190Q138 -10 94 26L86 19L77 10Q71 4 65 -1L54 -11H46H42Q39 -11 33 -5V74V132Q33 153 35 157T45 162H54Q66 162 70 158T75 146T82 119T101 77Q136 26 198 26Q295 26 295 104Q295 133 277 151Q257 175 194 187T111 210Q75 227 54 256T33 318Q33 357 50 384T93 424T143 442T187 447H198Q238 447 268 432L283 424L292 431Q302 440 314 448H322H326Q329 448 335 442V310L329 304H301Q295 310 295 316Z" transform="translate(2392,0)"></path></g></g></g></svg></mjx-container></p><p>The best resting buyer offers ₹100.00. The best resting seller wants ₹100.50.</p>
<p>They are ₹0.50 apart, so these two orders do <strong>not</strong> trade with each other.</p>
<p>The quoted “stock price” is often the last traded price; it can differ from both bid and ask.</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="first-choose-trade-now-or-name-your-price">First choose: trade now, or name your price?</h2>
<h3 id="market-order--trade-now">Market order — “trade now”</h3>
<ul>
<li>You specify the side and quantity, but <strong>not the execution price</strong>.</li>
<li>It immediately uses the best orders waiting on the opposite side.</li>
</ul>
<h3 id="limit-order--only-at-this-price-or-better">Limit order — “only at this price or better”</h3>
<ul>
<li>You specify the side, quantity, and limit price.</li>
<li>If nobody accepts that price now, the order <strong>waits in the book</strong>.</li>
</ul>
<blockquote>
<p>Market orders prioritize immediacy. Limit orders prioritize price.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="example-1--market-buy-50-shares">Example 1 · Market buy 50 shares</h2>
<p>You want to <strong>buy now</strong>, so you trade with the cheapest waiting seller:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">before: best ask = 150 shares @ ₹100.50
trade:                  50 @ ₹100.50
after:  best ask = 100 shares @ ₹100.50
</code></pre>
<p>The seller’s order supplied the shares. Its remaining quantity fell from 150 to 100.</p>
<p class="question"><strong>A market buy consumes the ask side.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="example-2--market-sell-50-shares">Example 2 · Market sell 50 shares</h2>
<p>You want to <strong>sell now</strong>, so you trade with the highest-paying waiting buyer:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">before: best bid = 100 shares @ ₹100.00
trade:                  50 @ ₹100.00
after:  best bid =  50 shares @ ₹100.00
</code></pre>
<p>The buyer’s order absorbed the shares. Its remaining quantity fell from 100 to 50.</p>
<p class="question"><strong>A market sell consumes the bid side.</strong></p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="example-3--limit-buy-50-at-%E2%82%B910020">Example 3 · Limit buy 50 at ₹100.20</h2>
<p>The lowest seller still asks ₹100.50. Your limit is only ₹100.20.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">best existing bid       your new bid       best ask
₹100.00                 ₹100.20             ₹100.50
</code></pre>
<p>No seller accepts ₹100.20 now, so your order <strong>does not trade</strong>. It waits in the book and becomes the new best bid.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">new spread = ₹100.50 − ₹100.20 = ₹0.30
</code></pre>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-large-market-order-consumes-depth">A large market order consumes depth</h2>
<p>Suppose you market-buy <strong>200 shares</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">best ask:       take all 150 @ ₹100.50
next-best ask:  take      50 @ ₹100.60
                         ───
total bought:            200 shares
</code></pre>
<p>Only 150 shares were available at the best price. The remaining 50 cost more.</p>
<blockquote>
<p><strong>Market depth</strong> is the quantity available across several price levels.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="orders-and-price-levels-are-different">Orders and price levels are different</h2>
<p>Three distinct orders may share one price:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">ID 71: BUY 40 @ 210.45
ID 83: BUY 25 @ 210.45     → price level 210.45 has quantity 100
ID 94: BUY 35 @ 210.45
</code></pre>
<ul>
<li><strong>Per-order state</strong> answers: “what did order 83 contain?”</li>
<li><strong>Per-level state</strong> answers: “how much demand exists at ₹210.45?”</li>
</ul>
<p>We will need both.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="three-order-message-codes-in-the-feed">Three order-message codes in the feed</h2>
<table>
<thead>
<tr>
<th>Code</th>
<th>Meaning</th>
<th>What it does</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>N</code></strong></td>
<td>new order</td>
<td>create an order ID; add its quantity at its price</td>
</tr>
<tr>
<td><strong><code>M</code></strong></td>
<td>modify order</td>
<td>replace the price and/or quantity of an existing order ID</td>
</tr>
<tr>
<td><strong><code>X</code></strong></td>
<td>cancel order</td>
<td>remove an existing order ID and its remaining quantity</td>
</tr>
</tbody>
</table>
<p>These are events published by the exchange. They tell our FPGA how the exchange’s book changed.</p>
<p>A <strong>trade</strong> is a separate event: matched buy and sell orders have traded, so their remaining quantities must be reduced.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="replay-the-events-to-reconstruct-the-book">Replay the events to reconstruct the book</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">N: id=71  BUY 40 @ 210.45       0 + 40  = 40
N: id=83  BUY 25 @ 210.45      40 + 25  = 65
M: id=71  quantity 40 → 75     65 - 40 + 75 = 100
X: id=83  cancel remaining 25  100 - 25 = 75
</code></pre>
<p><code>M</code> and <code>X</code> provide an <strong>order ID</strong>, not necessarily the old price and quantity.<br />
The receiver looks up the old order to know which price level to change.</p>
<blockquote>
<p>The market feed is an event log; the receiver reconstructs state by replaying it correctly.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-is-high-frequency-trading">What is high-frequency trading?</h2>
<p>For this lecture:</p>
<blockquote>
<p><strong>HFT is automated trading in which market data, state update, decision, and order generation form a latency-sensitive feedback loop.</strong></p>
</blockquote>
<p>It does <strong>not</strong> mean that every fast system is profitable, nor that latency is the only concern. Correctness, risk limits, regulation, and fairness remain system requirements.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="one-hft-strategy--market-making">One HFT strategy · Market making</h2>
<p>A market maker repeatedly tries to:</p>
<blockquote>
<p><strong>buy at the bid and sell at the ask</strong></p>
</blockquote>
<p>Suppose the book initially has:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">best bid = ₹99.99             best ask = ₹100.03
</code></pre>
<p>The HFT places <strong>better-priced</strong> limit orders inside that spread:</p>
<table>
<thead>
<tr>
<th>Order</th>
<th style="text-align:right">Quantity</th>
<th style="text-align:right">Price</th>
</tr>
</thead>
<tbody>
<tr>
<td>Buy</td>
<td style="text-align:right">100 shares</td>
<td style="text-align:right">₹100.00 — higher than ₹99.99</td>
</tr>
<tr>
<td>Sell</td>
<td style="text-align:right">100 shares</td>
<td style="text-align:right">₹100.02 — lower than ₹100.03</td>
</tr>
</tbody>
</table>
<p>Its quotes become the new best bid and best ask. Assume the firm already holds shares it can sell.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="one-completed-market-making-cycle">One completed market-making cycle</h2>
<ol>
<li>A market sell seeks the <strong>highest bid</strong>—now the firm’s ₹100.00 quote:</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">buy 100 @ ₹100.00       cash paid = ₹10,000
</code></pre>
<ol start="2">
<li>Later, a market buy seeks the <strong>lowest ask</strong>—now the firm’s ₹100.02 quote:</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">sell 100 @ ₹100.02      cash received = ₹10,002

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="small-gains-must-be-repeated">Small gains must be repeated</h2>
<p>If the firm completed 100,000 identical cycles:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">100,000 cycles × ₹2 per cycle = ₹200,000 = ₹2 lakh
</code></pre>
<p>But this is only the arithmetic. It assumes:</p>
<ul>
<li>both sides execute at the intended prices,</li>
<li>fees and taxes do not consume the spread,</li>
<li>the system can repeat the opportunity,</li>
<li>no large loss occurs between successful cycles.</li>
</ul>
<blockquote>
<p>HFT often seeks a small advantage many times—not one enormous trade.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-catch--only-one-side-may-execute">The catch · Only one side may execute</h2>
<p>Suppose the firm buys at ₹100.00. Before it can sell at ₹100.02, bad news arrives and the best bid falls to ₹99.90.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">buy:   100 @ ₹100.00
sell:  100 @  ₹99.90
</code></pre>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-speed-contributes">What speed contributes</h2>
<ul>
<li><strong>Cancel or update stale quotes</strong> when new market information arrives.</li>
<li><strong>Reach a good queue position</strong> when many traders quote the same price.</li>
<li><strong>Manage inventory quickly</strong> by adjusting prices, order sizes, or hedges.</li>
<li><strong>React consistently</strong> before a transient opportunity disappears.</li>
</ul>
<p>Prediction and risk control still decide whether reacting is sensible.</p>
<blockquote>
<p>Speed creates an opportunity to quote and react; it does not guarantee profit.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="another-strategy--arbitrage">Another strategy · Arbitrage</h2>
<p>Suppose the same stock is briefly available on two venues:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Venue A: buy  @ ₹100.00
Venue B: sell @ ₹100.03
</code></pre>
<p>The trader attempts both transactions and may capture ₹0.03 per share before costs.</p>
<p>But the opportunity may disappear before both orders execute. Then the trader is left with an unwanted position rather than a risk-free profit.</p>
<blockquote>
<p>Both examples require small advantages, reliable execution, and tight control of incomplete trades and losses.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-an-fpga-fits-this-loop">Why an FPGA fits this loop</h2>
<ul>
<li>Packets already arrive as a stream of bytes.</li>
<li>Parsing is fixed-field extraction and control.</li>
<li>Book updates are repeated, bounded state transitions.</li>
<li>Feature and decision logic can be a persistent pipeline.</li>
<li>The FPGA can sit directly between network ports.</li>
</ul>
<p class="question"><strong>Key advantage:</strong> begin work as bytes arrive; do not first move the packet through a host network stack.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-exchange-publishesnot-unicasts-to-each-trader">The exchange publishes—not unicasts to each trader</h2>
<p>NSE tick-by-tick data is distributed using <strong>UDP multicast</strong>.</p>
<ul>
<li>One sender publishes a stream.</li>
<li>Many subscribed receivers obtain the same datagrams.</li>
<li>Sequence numbers reveal a missing or reordered feed message.</li>
<li>UDP itself does not repair a loss.</li>
</ul>
<p class="ref"><a href="https://www.nseindia.com/static/market-data/real-time-data-subscription">NSE real-time data</a> · <a href="https://archives.nseindia.com/content/press/Realtime_CM_CD_TBT.pdf">NSE MTBT specification, v6.2</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="29" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-packet-is-nested-envelopes">A packet is nested envelopes</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Ethernet frame
└── IPv4 packet
    └── UDP datagram
        └── market-feed packet
            ├── global header: length, stream, sequence
            └── one or more market messages
</code></pre>
<p>Each layer tells us how to interpret the bytes inside it.</p>
<p>The order-book engine should receive typed fields—not raw Ethernet bytes.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-do-trading-oriented-cards-look-like">What do trading-oriented cards look like?</h2>
<table>
<thead>
<tr>
<th>Card</th>
<th>Network-facing links</th>
<th>Host link</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Alveo U50</strong></td>
<td>1× QSFP28: 100G, 40G, or 4×10/25G</td>
<td>PCIe Gen3×16 or Gen4×8</td>
<td>programmable FPGA + HBM accelerator</td>
</tr>
<tr>
<td><strong>Alveo X3522/X3522PV</strong></td>
<td>4× 10/25GbE through 2× DSFP28 cages</td>
<td>PCIe Gen4×8 / Gen3×8</td>
<td>low-latency trading NIC; PV exposes programmable FPGA fabric</td>
</tr>
<tr>
<td><strong>Solarflare X2522</strong></td>
<td>2× 10/25GbE SFP28</td>
<td>PCIe 3.1×8</td>
<td>low-latency conventional NIC for electronic trading</td>
</tr>
</tbody>
</table>
<p>Why several lower-rate ports? A trading system may connect to multiple exchange,<br />
feed, order-entry, or redundant links at once.</p>
<blockquote>
<p><strong>Link bandwidth is not packet latency.</strong> A 100G link moves more bits per second; cut-through design and pipeline depth determine reaction latency.</p>
</blockquote>
<p class="ref"><a href="https://docs.amd.com/r/en-US/ds965-u50/Product-Details">AMD U50 DS965</a> · <a href="https://docs.amd.com/r/en-US/ds1002-x3522/Product-Details">AMD X3522 DS1002</a> · <a href="https://www.amd.com/en/products/ethernet-adapters/x2522.html">AMD Solarflare X2522</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-real-fpga-tick-2-trade-example">A real FPGA tick-2-trade example</h2>
<p><strong>Tick-2-trade latency</strong> is measured from receiving a relevant market-data update<br />
(the <strong>tick</strong>) to transmitting the resulting order.</p>
<div class="pipeline"><span>NASDAQ<br />ITCH</span><b>→</b><span>hardware<br />decode</span><b>→</b><span>book +<br />strategy</span><b>→</b><span>hardware<br />encode</span><b>→</b><span>NASDAQ<br />OUCH</span></div>
<ul>
<li><strong>ITCH:</strong> exchange → trader; publishes orders, trades, and book changes.</li>
<li><strong>OUCH:</strong> trader → exchange; submits, replaces, and cancels orders.</li>
</ul>
<p>An actual vendor example—Design Gateway’s AAT-ITCH/OUCH on Alveo X3522-PV—implements ITCH market-data decoding and OUCH order generation directly in FPGA hardware. Its network and market-protocol pipeline also handles the associated UDP/TCP framing.</p>
<p class="ref"><a href="https://dgway.com/AAT/AAT_Main.html">Design Gateway, Accelerated Algorithmic Trading: AAT-ITCH/OUCH</a>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="parsing-is-a-streaming-computation">Parsing is a streaming computation</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">if</span> (byte_offset == TYPE_OFFSET)  event.type  = data;
<span class="hljs-keyword">if</span> (byte_offset == ID_OFFSET)    event.id    = <span class="hljs-built_in">read_u64</span>(data);
<span class="hljs-keyword">if</span> (byte_offset == PRICE_OFFSET) event.price = <span class="hljs-built_in">read_u32</span>(data);
</code></pre>
<p>The actual design must also handle:</p>
<ul>
<li>fields split across datapath beats,</li>
<li>byte order and field widths,</li>
<li>packet boundaries and valid-byte masks,</li>
<li>malformed lengths and unsupported message types.</li>
</ul>
<p>L8’s framed-stream contract applies unchanged.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-feed-becomes-a-typed-event">The feed becomes a typed event</h2>
<p>Conceptually:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">Event</span> {
  Kind kind;          <span class="hljs-comment">// New, Modify, Cancel, Trade</span>
  <span class="hljs-type">uint64_t</span> order_id;
  <span class="hljs-type">uint32_t</span> token;     <span class="hljs-comment">// instrument identifier</span>
  Side side;          <span class="hljs-comment">// Buy or Sell</span>
  <span class="hljs-type">uint32_t</span> price;
  <span class="hljs-type">uint32_t</span> quantity;
  <span class="hljs-type">uint64_t</span> timestamp;
};
</code></pre>
<p>Not every message supplies every field. The message type determines which fields are valid.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="sequence-numbers-are-part-of-correctness">Sequence numbers are part of correctness</h2>
<p>Suppose we receive:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">sequence: 1041, 1042, 1044
</code></pre>
<p>Message <code>1043</code> may contain a new, cancel, modify, or trade event. Continuing silently can corrupt the reconstructed book.</p>
<p class="warn"><strong>Fast and wrong is still wrong.</strong> Detect the gap, mark state suspect, and invoke the feed’s recovery policy.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-first-latency-boundary">The first latency boundary</h2>
<p>CPU path, conceptually:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">NIC → DMA → kernel/network stack → user memory → parser → book
</code></pre>
<p>FPGA inline path:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">MAC → streaming parser → book
</code></pre>
<p>The win is not merely a faster parser. It is the removal of intermediate scheduling and memory-movement boundaries.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="37" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="3--what-state-must-the-order-book-remember">3 · What state must the order book remember?</h1>
<h2 id="one-representation-cannot-make-every-operation-cheap">One representation cannot make every operation cheap</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="38" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-tempting-design">The tempting design</h2>
<p>Keep only the five best bids and five best asks.</p>
<p>This is wonderfully small—but incomplete.</p>
<p>If the fifth-best ask disappears, where is the sixth-best ask?</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">top 5: 210.55  210.60  210.65  210.70  210.80
next?:                                      ???
</code></pre>
<p>We need the full set of active price levels behind the cache.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="another-tempting-design">Another tempting design</h2>
<p>Keep only aggregate quantity at every price.</p>
<p>Then a cancel arrives:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">X: order_id = 83
</code></pre>
<p>Which price level should lose quantity? How much quantity?</p>
<p>We also need a mapping from <strong>order ID → order record</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="1--allorders-find-an-order-by-id">1 · <code>allOrders</code>: find an order by ID</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">order ID → {price, quantity, side, token, ...}
</code></pre>
<ul>
<li>Required for modify, cancel, and trade events.</li>
<li>Potentially millions of orders: too large for on-chip memory.</li>
<li>The paper places this global key–value table in <strong>HBM</strong>.</li>
</ul>
<p>This is the cold, large, identity-indexed view.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="42" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="2--orderbook-aggregate-by-price-tick">2 · <code>orderBook</code>: aggregate by price tick</h2>
<p>If tick size is ₹0.05:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">index = (price − base_price) / 0.05
</code></pre>
<p>The array entry stores aggregate information for that price level.</p>
<ul>
<li>Direct indexing makes a known-price update <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.618ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2041 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mn" transform="translate(1152,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mo" transform="translate(1652,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container>.</li>
<li>The paper places the full price-level structure in <strong>URAM</strong>.</li>
</ul>
<p>This is the complete, price-indexed view.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-fixed-ticks-are-hardware-friendly">Why fixed ticks are hardware-friendly</h2>
<p>Tree representation:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">compare → pointer → compare → pointer → ...
</code></pre>
<p>Fixed-tick array:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">price → arithmetic index → one memory access
</code></pre>
<p>The array trades unused price slots for predictable addressing and a regular memory structure.</p>
<blockquote>
<p>A market rule—the minimum tick—becomes an architectural simplification.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="44" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="3--topcache-make-the-hot-answer-tiny">3 · <code>topCache</code>: make the hot answer tiny</h2>
<p>Most decisions need only market depth, often the best five levels.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">best ask → [level 0, level 1, level 2, level 3, level 4]
best bid → [level 0, level 1, level 2, level 3, level 4]
</code></pre>
<p>The paper keeps this sorted cache in registers.</p>
<p>Small + fully available + sorted = immediate feature access.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="45" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-mask-answers-a-different-question">The mask answers a different question</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">price ticks:  ... 42 43 44 45 46 47 48 49 ...
quantity:     ...  0  0 70  0  0 15  0 20 ...
mask:         ...  0  0  1  0  0  1  0  1 ...
</code></pre>
<p>The full order book tells us <strong>how much</strong> exists.</p>
<p>The bitmask quickly tells us <strong>where the next non-empty level is</strong>.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="46" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="this-is-a-memory-hierarchy-by-role">This is a memory hierarchy by role</h2>
<table>
<thead>
<tr>
<th>State</th>
<th>Indexed by</th>
<th style="text-align:right">Size</th>
<th>Placement</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>topCache</code></td>
<td>rank</td>
<td style="text-align:right">tiny</td>
<td>registers</td>
<td>read every decision</td>
</tr>
<tr>
<td>mask</td>
<td>price tick</td>
<td style="text-align:right">bits/level</td>
<td>on chip</td>
<td>search occupancy</td>
</tr>
<tr>
<td><code>orderBook</code></td>
<td>price tick</td>
<td style="text-align:right">large</td>
<td>URAM</td>
<td>complete book</td>
</tr>
<tr>
<td><code>allOrders</code></td>
<td>order ID</td>
<td style="text-align:right">huge</td>
<td>HBM</td>
<td>recover old order</td>
</tr>
</tbody>
</table>
<p>This is L5’s memory lesson in a new domain: place data according to access pattern, not C type.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="47" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="4--update-the-book-one-event-at-a-time">4 · Update the book one event at a time</h1>
<h2 id="the-common-path-is-direct-removal-from-the-top-creates-the-hard-case">The common path is direct; removal from the top creates the hard case</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="48" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="new-order-update-known-locations">New order: update known locations</h2>
<p>For <code>N(id, side, price, qty)</code>:</p>
<ol>
<li>store the order in <code>allOrders[id]</code>,</li>
<li>add <code>qty</code> to <code>orderBook[price]</code>,</li>
<li>set <code>mask[price]</code>,</li>
<li>update <code>topCache</code> only if this price belongs in market depth.</li>
</ol>
<p>The price is in the message, so the full-book update is direct.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="49" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="new-order-one-cache-level-can-enter">New order: one cache level can enter</h2>
<p>Current asks, depth 5:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">210.55  210.60  210.65  210.70  210.80
</code></pre>
<p>New ask at <code>210.62</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">210.55  210.60  210.62  210.65  210.70    (210.80 leaves cache)
</code></pre>
<p>Only one candidate enters. A single insertion/sort step restores the sorted cache.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="50" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="cancel-first-recover-the-old-order">Cancel: first recover the old order</h2>
<p>For <code>X(id)</code>:</p>
<ol>
<li>read <code>{side, price, qty}</code> from <code>allOrders[id]</code>,</li>
<li>invalidate that order,</li>
<li>subtract <code>qty</code> from <code>orderBook[price]</code>,</li>
<li>clear the mask bit if aggregate quantity becomes zero,</li>
<li>repair <code>topCache</code> if it contained that level.</li>
</ol>
<p>The HBM lookup is on the logical dependency path.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="51" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="modify-often-delete--new">Modify: often delete + new</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">old: id 71, BUY 40 @ 210.45
new: id 71, BUY 25 @ 210.50
</code></pre>
<p>Conceptually:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">remove 40 from 210.45
add    25 to 210.50
replace allOrders[71]
</code></pre>
<p>The paper combines the work to avoid duplicate memory accesses. Quantity-only changes at one price can take a simpler path.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="52" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="trade-update-both-sides">Trade: update both sides</h2>
<p>A trade consumes quantity from a buy order and a sell order.</p>
<ul>
<li>Bid and ask structures are separate.</li>
<li>Their updates can proceed in parallel.</li>
<li>Either side may empty a top-cache level and require a refill.</li>
</ul>
<p>Parallelism comes from independence in the data structure—not merely from adding an <code>UNROLL</code> pragma.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="53" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-difficult-event">The difficult event</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">top asks: 210.55  210.60  210.65  210.70  210.80
cancel all remaining quantity at 210.60
</code></pre>
<p>After removal:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">210.55  210.65  210.70  210.80  ______
</code></pre>
<p>Which full-book price should fill the blank?</p>
<p>This is <strong>OBReduction</strong>: locate the next occupied price level.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="54" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-pure-linear-search-wastes-cycles">A pure linear search wastes cycles</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (p = after_last_cached; ; p++)
  <span class="hljs-keyword">if</span> (mask[p]) <span class="hljs-keyword">return</span> p;
</code></pre>
<ul>
<li>Cheap logic per checked bit.</li>
<li>Latency grows with the distance to the next valid price.</li>
<li>One bit per cycle is poor when empty price ranges are long.</li>
</ul>
<p>But a fully global priority encoder is large and routing-heavy.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="55" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="hybrid-search-linear-between-chunks">Hybrid search: linear between chunks</h2>
<p>Partition the bitmask:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">chunk 0      chunk 1      chunk 2      chunk 3
00000000  | 00000000  | 00100000  | 01010000
</code></pre>
<p>Check chunks in price order until one is nonzero.</p>
<p>This exploits the observation that activity is concentrated near the top of the book.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="56" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="hybrid-search-select-within-one-chunk">Hybrid search: select within one chunk</h2>
<p>Once a nonzero chunk is found:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">00100000
  ↑ first occupied price in the required direction
</code></pre>
<p>A small tree/priority search identifies the bit in logarithmic stages.</p>
<blockquote>
<p>Linear across nearby chunks; binary/tree-like selection inside the winning chunk.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="57" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-this-is-fast-in-practice">Why this is fast in practice</h2>
<p>The paper measured where the replacement level was found.</p>
<ul>
<li>Most activity occurs near the best bid and ask.</li>
<li>With 16-bit chunks, its examined stocks found the next level in the first chunk about <strong>99%</strong> of the time.</li>
<li>The within-chunk search then takes four search steps.</li>
</ul>
<p class="ref">Kashera et al., FPL 2023, Sec. IV and Fig. 1. This is an empirical workload property, not a universal bound.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="58" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="average-case-and-worst-case-are-not-the-same">Average case and worst case are not the same</h2>
<p>Fast common case:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">next level is in the first nearby chunk
</code></pre>
<p>Adversarial or sparse case:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">many empty chunks must be crossed
</code></pre>
<p>The hardware needs both:</p>
<ul>
<li>an optimized likely path,</li>
<li>a correct bounded policy for distant levels and bursts of difficult updates.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="59" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="one-event-four-consistent-structures">One event, four consistent structures</h2>
<p>After every committed update, these must agree:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">allOrders  ↔  orderBook  ↔  mask  ↔  topCache
</code></pre>
<p>Useful invariants:</p>
<ul>
<li>mask bit is 1 iff the level quantity is nonzero,</li>
<li>top cache is sorted and contains the true best <code>D</code> levels,</li>
<li>aggregate quantity equals the sum of live orders at that price,</li>
<li>no cancelled order remains live.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="60" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="5--turn-the-algorithm-into-a-streaming-fpga-system">5 · Turn the algorithm into a streaming FPGA system</h1>
<h2 id="separate-transport-parsing-state-update-and-publication">Separate transport, parsing, state update, and publication</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="61" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="the-papers-implemented-datapath">The paper’s implemented datapath</h2>
<div class="pipeline"><span>40G<br />QSFP+</span><b>→</b><span>Ethernet</span><b>→</b><span>UDP/IP</span><b>→</b><span>line + feed<br />arbitration</span><b>→</b><span>order-book<br />kernel</span></div>
<ul>
<li>Feed arbitration selects instruments to track.</li>
<li>Kernels communicate through AXI4-style streams.</li>
<li>The order-book kernel separates packet pull/unpack from state update.</li>
</ul>
<p>This is a persistent dataflow graph, not a host-launched function per packet.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="62" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="why-split-unpack-from-update">Why split unpack from update?</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">packet stream → pull + unpack → event FIFO → update engine
</code></pre>
<ul>
<li>Parser timing is regular and byte-oriented.</li>
<li>Update latency depends on message type and memory access.</li>
<li>The FIFO decouples short scheduling variation.</li>
</ul>
<p>But the FIFO cannot cure a permanently slower update engine. Its required depth follows from the worst admissible burst.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="63" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="one-event-may-need-several-memories">One event may need several memories</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">cancel ID
   ↓
HBM: fetch old order
   ↓
URAM: subtract price-level quantity
   ↓
mask/topCache: possibly refill
</code></pre>
<p>The latency is a <strong>dependency chain</strong>. Issuing all accesses “in parallel” would be incorrect because the later addresses and actions depend on the HBM result.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="64" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="hazard-two-events-touch-the-same-state">Hazard: two events touch the same state</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">event A: add 20 at price p
event B: cancel 10 at price p
</code></pre>
<p>If B reads the old quantity before A writes the new one, an II=1 pipeline can lose an update.</p>
<p>Possible remedies:</p>
<ul>
<li>forwarding/bypass of recent updates,</li>
<li>serialize conflicting keys,</li>
<li>bank by instrument or side,</li>
<li>preserve feed order at commit.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="65" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="partition-by-an-independent-key">Partition by an independent key</h2>
<p>Events for different instruments have independent books:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">token 11 → book engine/bank 0
token 42 → book engine/bank 1
token 87 → book engine/bank 2
</code></pre>
<p>Sharding exposes throughput without violating per-instrument event order.</p>
<p>The feed arbitrator becomes a stateful router whose ordering contract matters.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="66" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="what-the-paper-measured">What the paper measured</h2>
<p>On an Alveo U50 at 300 MHz:</p>
<table>
<thead>
<tr>
<th>Measured scope</th>
<th style="text-align:right">Average</th>
<th style="text-align:right">Reported worst case</th>
</tr>
</thead>
<tbody>
<tr>
<td>order-book subsystem</td>
<td style="text-align:right">105 cycles = <strong>350 ns</strong></td>
<td style="text-align:right">150 cycles = <strong>500 ns</strong></td>
</tr>
<tr>
<td>complete HFT system through book update</td>
<td style="text-align:right">200 cycles = <strong>660 ns</strong></td>
<td style="text-align:right">—</td>
</tr>
</tbody>
</table>
<p>The design tracked two tickers with 50,000 price levels each.</p>
<p class="ref">Kashera et al., FPL 2023, Sec. VII and Table IV.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="67" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="read-the-number-with-its-endpoint">Read the number with its endpoint</h2>
<p>The paper’s <strong>660 ns</strong> ends after the market-feed packet has traversed the network/parser stack and updated the book.</p>
<p>It does <strong>not</strong> include:</p>
<ul>
<li>predictive model,</li>
<li>trading strategy,</li>
<li>pre-trade risk checks,</li>
<li>outbound order encoding,</li>
<li>transmit serialization,</li>
<li>exchange travel or matching.</li>
</ul>
<blockquote>
<p>It is feed-to-book latency, not full feed-to-order round-trip latency.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="68" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="resource-placement-is-part-of-the-result">Resource placement is part of the result</h2>
<p>For the two-ticker experiment in SLR0:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">LUT 25.54%   registers 18.17%   BRAM 20.61%
URAM 62.50%  DSP 1.39%
</code></pre>
<p>The order-book kernel was placed near HBM to reduce cross-SLR movement.</p>
<p>The low DSP use leaves room for downstream arithmetic; the high URAM use warns that more books require careful scaling.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="section" data-theme="fpga" lang="C" class="section" data-marpit-pagination="69" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:section;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h1 id="6--close-the-loop-in-hardware">6 · Close the loop in hardware</h1>
<h2 id="a-current-book-is-useful-only-when-it-reaches-a-safe-action">A current book is useful only when it reaches a safe action</h2>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="70" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="book-construction-is-the-middlenot-the-end">Book construction is the middle—not the end</h2>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="stage-2--prediction-is-not-the-same-as-strategy">Stage 2 · Prediction is not the same as strategy</h2>
<p>Prediction asks:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">What may happen next?
</code></pre>
<p>Examples: probability of an upward price move, short-term fair value, or likelihood that a quote will fill.</p>
<p>Strategy asks:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Given that belief and our current position, what do we want to do?
</code></pre>
<p>Keeping the two separate makes testing and risk reasoning clearer.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="73" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-hardware-predictor-can-be-simple">A hardware predictor can be simple</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">score = w0
      + w1 * spread
      + w2 * imbalance
      + w3 * recent_trade_sign;

signal = (score &gt; threshold);
</code></pre>
<ul>
<li>fixed-point multiply–accumulate pipeline,</li>
<li>weights in registers/BRAM,</li>
<li>one prediction per accepted book update after pipeline fill.</li>
</ul>
<p>The model must be trained and validated elsewhere; hardware makes inference fast, not correct by itself.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="74" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="or-prediction-may-be-a-small-treemodel-pipeline">Or prediction may be a small tree/model pipeline</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">features → compare → branch/select → score → confidence
</code></pre>
<p>The architecture choice depends on:</p>
<ul>
<li>required model accuracy,</li>
<li>fixed worst-case latency,</li>
<li>update frequency for parameters,</li>
<li>numerical precision,</li>
<li>available DSP/BRAM and timing margin.</li>
</ul>
<p>Avoid an opaque model whose latency or failure behavior cannot be bounded.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="75" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="stage-3--strategy-creates-an-order-intent">Stage 3 · Strategy creates an order intent</h2>
<p>An intent is not yet a packet:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">{instrument, side, price, quantity, action}
</code></pre>
<p>Example policy:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">if</span> (up_probability &gt; THRESHOLD &amp;&amp; position &lt; LIMIT)
    intent = <span class="hljs-built_in">BuyLimit</span>(token, best_bid, SIZE);
</code></pre>
<p>The strategy also needs state: position, outstanding orders, recent actions, and acknowledgements.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="76" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="stage-4--risk-must-be-on-the-fast-path">Stage 4 · Risk must be on the fast path</h2>
<p>Before transmit, enforce hard limits such as:</p>
<ul>
<li>maximum order quantity and notional,</li>
<li>price collars,</li>
<li>position/exposure limit,</li>
<li>message-rate limit,</li>
<li>duplicate/order-state checks,</li>
<li>global kill switch.</li>
</ul>
<p class="warn"><strong>Risk is not an optional slow-path callback.</strong> The order must not bypass it because the host is late.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="stage-5--encode-the-outbound-protocol">Stage 5 · Encode the outbound protocol</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">order intent
  → allocate client order ID / sequence
  → serialize order-entry message
  → UDP/TCP or exchange-specific transport
  → IP + Ethernet
  → MAC + PHY
  → wire
</code></pre>
<p>This is the parser in reverse—but with stateful sequence numbers, checksums, acknowledgements, and retransmission/recovery rules.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="78" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="everything-in-hardware-still-needs-a-host">“Everything in hardware” still needs a host</h2>
<p>Keep the nanosecond-critical data path on FPGA:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">RX → book → features → predict → decide → risk → TX
</code></pre>
<p>Use the host control plane for:</p>
<ul>
<li>loading model parameters and limits,</li>
<li>session setup and recovery,</li>
<li>monitoring, audit, and logging,</li>
<li>exceptional conditions and operator control.</li>
</ul>
<p>Hardware fast path and software control plane are complementary.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="79" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="95">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="two-loops-now-exist">Two loops now exist</h2>
<p>Fast market loop:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">market event → decision → outbound order
</code></pre>
<p>Order-state loop:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">outbound order → acknowledgement/fill/reject → position + live-order state
</code></pre>
<p>A strategy that ignores the second loop may repeatedly trade on stale assumptions about inventory or outstanding orders.</p>
<footer>IIIT · Suresh Purini</footer>
</section>

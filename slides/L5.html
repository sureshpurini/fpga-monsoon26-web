<h1 id="lecture-5--memory-customization">Lecture 5 — Memory customization</h1>
<h2 id="feed-a-wide-datapath-without-drowning-in-memory">Feed a wide datapath without drowning in memory</h2>
<p><strong>Ports → banks or wide words · Capacity → tiles · Latency → overlap · Placement → hierarchy</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="2" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="33">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="todays-contract">Today’s contract</h2>
<p>By the end, you should be able to look at an access pattern and answer:</p>
<ol>
<li><strong>How many values per cycle</strong> does the datapath demand?</li>
<li>Do those values need <strong>independent addresses</strong>, or do they move as a group?</li>
<li>What is the <strong>smallest useful working set</strong> that must live on-chip?</li>
<li>Can transfer and compute <strong>overlap</strong>, and which stage sets throughput?</li>
<li>Which storage resource should hold each buffer?</li>
</ol>
<blockquote>
<p>The goal is not to memorize pragmas. It is to design the memory system implied by the schedule.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="3" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="33">

<h2 id="bridge-from-l4--row-wise-gemm">Bridge from L4 — row-wise GEMM</h2>

++) {

<div>
<ul>
<li><code>a</code> is <strong>broadcast</strong>.</li>
<li><code>Bbuf[k][j]</code> is read <strong>unit-stride</strong>.</li>
<li><code>Crow[j]</code> is a private running sum.</li>
<li>Pipelining <code>j</code> reaches <strong>one update/cycle</strong>.</li>
</ul>
<p><strong>Today:</strong> widen this to <code>U</code> updates/cycle—and pay every memory bill honestly.</p>

<h2 id="start-with-a-demand-table">Start with a demand table</h2>
<p>Unroll the <code>j</code> loop by <code>U</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j = <span class="hljs-number">0</span>; j &lt; N; j += U) {
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS PIPELINE II=1</span>
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> u = <span class="hljs-number">0</span>; u &lt; U; u++) {
    <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS UNROLL</span>
    Crow[j+u] += a * Bbuf[k][j+u];
  }
}
</code></pre>
<table>
<thead>
<tr>
<th>Object</th>
<th style="text-align:right">Values needed each cycle</th>
<th>Access relationship</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>a</code></td>
<td style="text-align:right">1 read</td>
<td>broadcast to all lanes</td>
</tr>
<tr>
<td><code>Bbuf</code></td>
<td style="text-align:right"><code>U</code> reads</td>
<td>consecutive, aligned group</td>
</tr>
<tr>
<td><code>Crow</code></td>
<td style="text-align:right"><code>U</code> read-modify-writes</td>
<td>independent accumulators</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Optimization begins with <strong>counting accesses in one cycle</strong>.</p>

<h2 id="partition-one-array-%E2%86%92-several-banks">Partition: one array → several banks</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">data_t</span> Crow[N];
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=Crow cyclic factor=U</span>
</code></pre>
<ul>
<li>Bank function for cyclic partitioning: <code>bank(j) = j mod U</code>.</li>
<li><code>j, j+1, …, j+U−1</code> land in different banks.</li>
<li>Each bank has its own ports, so the lanes can access <strong>independent addresses</strong>.</li>
<li>Cost: more memory instances, routing, and control.</li>
</ul>
<blockquote>
<p>Partitioning changes the <strong>number of independently addressable memories</strong>.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>

<h2 id="reshape-one-memory-%E2%86%92-wider-words">Reshape: one memory → wider words</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">data_t</span> Bbuf[K][N];
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_RESHAPE variable=Bbuf cyclic factor=U dim=2</span>
</code></pre>
<div class="columns">
<div>
<ul>
<li>One address returns <code>U</code> elements together.</li>
<li>Best when lanes consume a fixed, aligned group.</li>
<li>Depth falls; word width grows.</li>
<li>Address freedom does <strong>not</strong> grow.</li>
</ul>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">logical:  B[k][0] B[k][1] B[k][2] B[k][3]
                         ↓ pack
physical word 0: { b0, b1, b2, b3 }
</code></pre>
</div>
</div>
<blockquote>
<p>Reshaping changes the <strong>width of one memory access</strong>.</p>
</blockquote>

<h2 id="apply-the-rule-to-gemm">Apply the rule to GEMM</h2>
<table>
<thead>
<tr>
<th>Array</th>
<th>Pattern</th>
<th>Layout</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Crow</code></td>
<td><code>U</code> independent accumulators</td>
<td>cyclic partition</td>
<td>separate feedback state per lane</td>
</tr>
<tr>
<td><code>Bbuf[k][:]</code></td>
<td><code>U</code> consecutive aligned values</td>
<td>cyclic reshape on <code>dim=2</code></td>
<td>one wide word feeds all lanes</td>
</tr>
<tr>
<td>scalar <code>a</code></td>
<td>one value used by every lane</td>
<td>register/broadcast</td>
<td>no extra reads needed</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=Crow cyclic factor=U</span>
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_RESHAPE   variable=Bbuf cyclic factor=U dim=2</span>
</code></pre>
<blockquote>
<p><code>UNROLL</code> creates consumers. The matching layout must create the delivery bandwidth.</p>
</blockquote>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="important-limits">Important limits</h2>
<ul>
<li>If <code>N % U != 0</code>, guard the tail or pad the row.</li>
<li>A sliding window (<code>j++</code> while reading <code>j…j+U−1</code>) is not an aligned wide-word access; use banking or a line buffer.</li>
<li>Partition factors can waste BRAM because each bank rounds up to a physical primitive.</li>
<li>Reshape width must still match downstream interfaces and operator inputs.</li>
<li>After fixing ports, a floating-point accumulator recurrence may become the next bottleneck.</li>
</ul>
<p class="question"><strong>Minute exercise:</strong> sketch the banks for U=4 and mark where indices 6, 7, 8, 9 land.</p>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="tiling-moves-cost-it-does-not-erase-it">Tiling moves cost; it does not erase it</h2>
<p>For <code>N/T</code> column tiles:</p>
<table>
<thead>
<tr>
<th>Matrix</th>
<th style="text-align:right">Off-chip elements transferred</th>
<th style="text-align:right">Relative reads/writes</th>
</tr>
</thead>
<tbody>
<tr>
<td>B</td>
<td style="text-align:right"><code>K·N</code></td>
<td style="text-align:right">read ×1</td>
</tr>
<tr>
<td>A</td>
<td style="text-align:right"><code>M·K·(N/T)</code></td>
<td style="text-align:right">read ×<code>N/T</code></td>
</tr>
<tr>
<td>C</td>
<td style="text-align:right"><code>M·N</code></td>
<td style="text-align:right">write ×1</td>
</tr>
</tbody>
</table>
<ul>
<li>Larger <code>T</code> reduces repeated A traffic.</li>
<li>Smaller <code>T</code> reduces on-chip capacity.</li>
<li>The “largest tile that fits” is a starting point—not automatically optimal after banking and double buffering.</li>
</ul>
<blockquote>
<p>Capacity model: <code>bytes(Btile) = K · T · sizeof(data_t)</code> before replication and padding.</p>
</blockquote>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="correct-scope-stages-must-persist-across-tiles">Correct scope: stages must persist across tiles</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">gemm</span><span class="hljs-params">(...)</span> </span>{
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-built_in">load_tiles</span>   (B,  b_channels, tile_count);
  <span class="hljs-built_in">compute_tiles</span>(A,  b_channels, c_channels, tile_count);
  <span class="hljs-built_in">store_tiles</span>  (C,  c_channels, tile_count);
}
</code></pre>
<ul>
<li>Each stage contains its own tile loop and runs for the whole invocation.</li>
<li>Channels carry either sequential elements or whole-block ownership.</li>
<li>Tile buffers need two slots (explicit ping-pong or a block-stream/PIPO mechanism).</li>
<li>Verify overlap in the <strong>dataflow viewer</strong>; do not infer it from source order.</li>
</ul>
<blockquote>
<p>A <code>DATAFLOW</code> region recreated inside each tile iteration does not, by itself, establish a persistent cross-tile pipeline.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="xdense" data-theme="fpga" lang="C" class="xdense" data-marpit-pagination="22" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:xdense;--theme:fpga;" data-marpit-pagination-total="33">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="persistent-stages--block-stream-implementation">Persistent stages — block-stream implementation</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;hls_streamofblocks.h&quot;</span></span>
<span class="hljs-keyword">using</span> BBlock = <span class="hljs-type">data_t</span>[K][T];  <span class="hljs-keyword">using</span> CBlock = <span class="hljs-type">data_t</span>[M][T];

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">load_tiles</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">data_t</span> *B, hls::stream_of_blocks&lt;BBlock&gt;&amp; out)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t = <span class="hljs-number">0</span>; t &lt; NT; t++) {
    <span class="hljs-function">hls::write_lock&lt;BBlock&gt; <span class="hljs-title">b</span><span class="hljs-params">(out)</span></span>;       <span class="hljs-comment">// acquire an empty tile slot</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> k=<span class="hljs-number">0</span>; k&lt;K; k++) <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j=<span class="hljs-number">0</span>; j&lt;T; j++)
      b[k][j] = B[k*N + t*T + j];
  }                                       <span class="hljs-comment">// release filled slot</span>
}
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">compute_tiles</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">data_t</span> *A, hls::stream_of_blocks&lt;BBlock&gt;&amp; in,
                   hls::stream_of_blocks&lt;CBlock&gt;&amp; out)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t = <span class="hljs-number">0</span>; t &lt; NT; t++) {
    <span class="hljs-function">hls::read_lock&lt;BBlock&gt; <span class="hljs-title">b</span><span class="hljs-params">(in)</span></span>;          <span class="hljs-comment">// acquire filled B tile</span>
    <span class="hljs-function">hls::write_lock&lt;CBlock&gt; <span class="hljs-title">c</span><span class="hljs-params">(out)</span></span>;        <span class="hljs-comment">// acquire empty C tile</span>
    <span class="hljs-built_in">compute_one_tile</span>(A, b, c);             <span class="hljs-comment">// partition/reshape inside</span>
  }                                       <span class="hljs-comment">// release both slots</span>
}
<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">store_tiles</span><span class="hljs-params">(<span class="hljs-type">data_t</span> *C, hls::stream_of_blocks&lt;CBlock&gt;&amp; in)</span> </span>{
  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> t = <span class="hljs-number">0</span>; t &lt; NT; t++) {
    <span class="hljs-function">hls::read_lock&lt;CBlock&gt; <span class="hljs-title">c</span><span class="hljs-params">(in)</span></span>;          <span class="hljs-comment">// acquire filled C tile</span>
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i=<span class="hljs-number">0</span>; i&lt;M; i++) <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> j=<span class="hljs-number">0</span>; j&lt;T; j++)
      C[i*N + t*T + j] = c[i][j];
  }
}
</code></pre>
<blockquote>
<p>Locks transfer <strong>ownership of a whole random-access tile</strong>; leaving scope releases it to the next stage.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-class="dense" data-theme="fpga" lang="C" class="dense" data-marpit-pagination="23" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--class:dense;--theme:fpga;" data-marpit-pagination-total="33">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="top-level--connect-the-persistent-stages">Top level — connect the persistent stages</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">gemm</span><span class="hljs-params">(<span class="hljs-type">const</span> <span class="hljs-type">data_t</span> *A, <span class="hljs-type">const</span> <span class="hljs-type">data_t</span> *B, <span class="hljs-type">data_t</span> *C)</span> </span>{
  hls::stream_of_blocks&lt;BBlock&gt; b_tiles;  <span class="hljs-comment">// empty/full B tile slots</span>
  hls::stream_of_blocks&lt;CBlock&gt; c_tiles;  <span class="hljs-comment">// empty/full C tile slots</span>

  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS DATAFLOW</span>
  <span class="hljs-built_in">load_tiles</span>   (B, b_tiles);
  <span class="hljs-built_in">compute_tiles</span>(A, b_tiles, c_tiles);
  <span class="hljs-built_in">store_tiles</span>  (C, c_tiles);
}
</code></pre>
<ul>
<li>Each function is invoked once and loops over <strong>all <code>NT = ceil(N/T)</code> tiles</strong>.</li>
<li>Producer and consumer block when no empty/full slot is available.</li>
<li>With two slots, <code>load(t+1) ∥ compute(t) ∥ store(t−1)</code> can execute.</li>
<li><code>compute_one_tile</code> still applies the earlier <code>B</code> reshape, <code>Crow</code> partition, unroll, and pipeline.</li>
</ul>
<blockquote>
<p>This uses Vitis HLS <code>hls::stream_of_blocks</code>: block-level synchronization plus random access inside each tile.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="33">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="pipo-versus-fifo">PIPO versus FIFO</h2>
<table>
<thead>
<tr>
<th>Communication</th>
<th>PIPO / block channel</th>
<th><code>hls::stream</code> FIFO</th>
</tr>
</thead>
<tbody>
<tr>
<td>Handoff</td>
<td>whole tile</td>
<td>element by element</td>
</tr>
<tr>
<td>Access within item</td>
<td>random/indexed</td>
<td>sequential</td>
</tr>
<tr>
<td>Storage</td>
<td>usually two tile slots</td>
<td>depth × element width</td>
</tr>
<tr>
<td>Best for</td>
<td>matrices, frames, reusable blocks</td>
<td>samples, pixels, tokens</td>
</tr>
</tbody>
</table>
<ul>
<li>Tiled GEMM reuses and indexes B within a tile → block storage is natural.</li>
<li>A streaming producer/consumer with matching order can use a FIFO.</li>
<li>Every channel needs a producer/consumer rate and depth argument; L6 develops that fully.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="FPGA — High-Performance Kernels · Monsoon 2026" data-footer="IIIT · Suresh Purini" data-theme="fpga" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:FPGA — High-Performance Kernels · Monsoon 2026;--footer:IIIT · Suresh Purini;--theme:fpga;" data-marpit-pagination-total="33">
<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="balance-before-adding-another-buffer">Balance before adding another buffer</h2>
<p>Example per tile:</p>
<table>
<thead>
<tr>
<th>Stage</th>
<th style="text-align:right">Cycles</th>
</tr>
</thead>
<tbody>
<tr>
<td>load</td>
<td style="text-align:right">2,000</td>
</tr>
<tr>
<td>compute</td>
<td style="text-align:right">7,500</td>
</tr>
<tr>
<td>store</td>
<td style="text-align:right">1,000</td>
</tr>
</tbody>
</table>
<ul>
<li>Serial: <code>10,500 cycles/tile</code>.</li>
<li>Overlapped steady state: about <code>7,500 cycles/tile</code>.</li>
<li>Speedup ceiling: <code>10,500 / 7,500 = 1.4×</code>.</li>
<li>Optimizing store below 1,000 cycles changes no steady-state throughput; compute is the bottleneck.</li>
</ul>
<p class="question"><strong>Decision:</strong> spend the next BRAM on another buffer, or the next DSPs on more compute lanes?</p>
<footer>IIIT · Suresh Purini</footer>
</section>

<h2 id="placement-follows-role">Placement follows role</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">data_t</span> Btile[K][T];
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS BIND_STORAGE variable=Btile type=ram_2p impl=uram</span>

<span class="hljs-type">data_t</span> small_bank[T];
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS BIND_STORAGE variable=small_bank type=ram_2p impl=bram</span>

<span class="hljs-type">data_t</span> acc[U];
<span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=acc complete</span>
</code></pre>
<table>
<thead>
<tr>
<th>Role</th>
<th>Typical home</th>
</tr>
</thead>
<tbody>
<tr>
<td>full matrices</td>
<td>HBM</td>
</tr>
<tr>
<td>deep tile storage</td>
<td>URAM</td>
</tr>
<tr>
<td>moderate buffers / banks</td>
<td>BRAM</td>
</tr>
<tr>
<td>small, highly parallel state</td>

</tr>
</tbody>
</table>
<blockquote>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="a-repeatable-design-loop">A repeatable design loop</h2>
<ol>
<li><strong>Schedule:</strong> choose lanes (<code>U</code>) and target II.</li>
<li><strong>Count:</strong> list reads/writes per cycle for every array.</li>
<li><strong>Shape:</strong> partition for address freedom; reshape for grouped width.</li>
<li><strong>Tile:</strong> bound the working set and calculate total traffic.</li>
<li><strong>Overlap:</strong> compare load, compute, and store cycles.</li>
<li><strong>Place:</strong> map deep, banked, and scalar storage to suitable resources.</li>
<li><strong>Verify:</strong> synthesis II reasons, memory instances, utilization, burst widths, dataflow timeline.</li>
</ol>
<blockquote>
<p>Change one lever at a time; preserve a report that proves what changed.</p>
</blockquote>
<footer>IIIT · Suresh Purini</footer>
</section>

<blockquote>
<p>HBM supplies capacity · URAM holds a reusable macro-tile · BRAM supplies lane bandwidth · registers hold live state.</p>
</blockquote>
<p class="question"><strong>Scope:</strong> this first view shows blocking and placement only. For simplicity, transfers are serialized—no <code>DATAFLOW</code> or double buffering yet.</p>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>

<h2 id="two-blocking-levels-in-the-gemm-schedule">Two blocking levels in the GEMM schedule</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> ju = <span class="hljs-number">0</span>; ju &lt; N; ju += TU) {       <span class="hljs-comment">// HBM → URAM</span>
  <span class="hljs-type">data_t</span> Bmacro[K][TU];
  <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS BIND_STORAGE variable=Bmacro type=ram_2p impl=uram</span>
  <span class="hljs-built_in">load_macro_tile</span>(B, Bmacro, ju);

  <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> jb = <span class="hljs-number">0</span>; jb &lt; TU; jb += TB) {    <span class="hljs-comment">// URAM → BRAM</span>
    <span class="hljs-type">data_t</span> Bmicro[K][TB];
    <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS BIND_STORAGE variable=Bmicro type=ram_2p impl=bram</span>
    <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_RESHAPE variable=Bmicro cyclic factor=U dim=2</span>
    <span class="hljs-built_in">stage_micro_tile</span>(Bmacro, Bmicro, jb);

    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; M; i++) {
      <span class="hljs-type">data_t</span> Crow[TB] = {<span class="hljs-number">0</span>};
      <span class="hljs-meta">#<span class="hljs-keyword">pragma</span> HLS ARRAY_PARTITION variable=Crow cyclic factor=U</span>
      <span class="hljs-built_in">compute_strip</span>(A, Bmicro, Crow, i);    <span class="hljs-comment">// U MAC updates/cycle</span>
      <span class="hljs-built_in">store_strip</span>(C, Crow, i, ju + jb);
    }
  }
}
</code></pre>
<ul>
<li><code>TU</code> is chosen for <strong>URAM capacity/reuse</strong>; <code>TB</code> for <strong>BRAM bandwidth</strong>, with <code>TB ≤ TU</code> and usually <code>TB % U = 0</code>.</li>
<li><strong>Simplification:</strong> the code is sequential; <code>load_macro_tile</code>, <code>stage_micro_tile</code>, compute, and store do not overlap.</li>
<li>An optimized version may add persistent <code>DATAFLOW</code> stages and ping-pong buffers at either boundary; each double buffer doubles that level’s storage.</li>
</ul>
<footer>IIIT · Suresh Purini</footer>
</section>

<header>FPGA — High-Performance Kernels · Monsoon 2026</header>
<h2 id="exit-ticket">Exit ticket</h2>
<p>For a kernel unrolled by 8 that reads eight aligned neighbors and updates eight independent sums:</p>
<ol>
<li>Which array should be reshaped, and which partitioned?</li>
<li>A dual-port uncustomized array receives 8 reads/cycle. What port-bound II do you predict?</li>
<li>If <code>load=4k</code>, <code>compute=6k</code>, <code>store=2k</code> cycles, what is the serial tile time? The overlapped steady-state interval?</li>
<li>If halving tile width doubles the number of tiles, which GEMM operand’s traffic increases in our column-strip schedule?</li>
</ol>
<p class="answer">Answers: neighbor array reshape; sums partition · II ≥ 4 · 12k and 6k cycles · A traffic increases.</p>
<footer>IIIT · Suresh Purini</footer>
</section>
